"3.23 \"Конец зоны запрещения обгона грузовым автомобилям\".","для знаков 3.20, 3.22, 3.24 установкой в конце зоны их действия соответственно знаков 3.21, 3.23, 3.25 или применением таблички 7.2.1. Зона действия знака 3.24 может быть уменьшена установкой знака 3.24 с другим значением максимальной скорости движения;","6.2 \"Больница\".","7.4.9-7.4.14 \"Кроме вида транспортного средства\". Указывают вид транспортного средства, на который не распространяется действие знака.","1.16.1 \"Искусственная неровность\".","Предупреждающие знаки 1.1, 1.2, 1.5-1.30 вне населенных пунктов устанавливаются на расстоянии 150 - 300 м, а в населенных пунктах и жилых зонах - на расстоянии 50 - 100 м до начала опасного участка. При необходимости знаки могут устанавливаться и на ином расстоянии, которое в этом случае указывается на табличке 7.1.1.","5.43 \"Искусственная неровность\". Обозначает границы искусственной неровности. Устанавливается на ближней границе искусственной неровности или разметки 1.25 относительно приближающихся транспортных средств.","4.5.6, 4.5.7 \"Конец пешеходной и велосипедной дорожки с разделением движения\".","5.10.2, 5.10.3 \"Выезд на дорогу с полосой для маршрутных транспортных средств\".","6.19 \"Автозаправочная станция с возможностью зарядки электромобилей\".","1.14 \"Крутой подъем\".","Знаки 1.13 и 1.14 могут устанавливаться без таблички 7.1.1 непосредственно перед началом спуска или подъема, если спуски и подъемы следуют друг за другом.","4.2.3 \"Объезд препятствия справа или слева\". Объезд разрешается с любой стороны.","2.3.1 \"Пересечение со второстепенной дорогой\".","3.33 \"Движение транспортных средств со взрывчатыми и легковоспламеняющимися грузами запрещено\". Запрещается движение транспортных средств, оборудованных опознавательными знаками \"Опасный груз\" и предназначенных для перевозки опасных грузов классов 1,2.2 - 2.4, 3.1, 3.2, 5.2.","7.2.1 \"Зона действия\". Указывает протяженность опасного участка дороги, обозначенного знаками, или зону действия запрещающих и информационно-указательных знаков.","для знаков 3.16 и 3.26 применением таблички 7.2.1;","5.8.6а - 5.8.6в \"Перестроение на параллельную проезжую часть\". Информируют водителей о приоритетах движения при перестроении на параллельную проезжую часть.","Информационно-указательные знаки 5.8.1-5.8.8, 5.11.1 и 5.11.2 могут совмещаться с запрещающими знаками 3.3-3.8.","4.1.1 \"Движение прямо\", 4.1.2 \"Движение направо\", 4.1.3 \"Движение налево\", 4.1.4 \"Движение прямо или направо\", 4.1.5 \"Движение прямо или налево\", 4.1.6 \"Движение направо или налево2. Разрешается движение только в направлениях, указанных на знаках стрелками. Знаки, разрешающие поворот налево, разрешают и разворот (могут быть применены знаки 4.1.1 - 4.1.6 с конфигурацией стрелок, соответствующей требуемым направлениям движения на конкретном пересечении).","Действие знаков 4.1.1 - 4.1.6 не распространяется на маршрутные транспортные средства.","Действие знаков 4.1.1 - 4.1.6 распространяется на пересечение проезжих частей, перед которым установлен знак.","Табличка 7.24 применяют со знаками 3.2-3.6, 4.1.1-4.1.6, 3.18.1, 3.18.2 для распространения действия знака на транспортные средства с экологическим классом ниже указанного на табличке или экологический класс которых не указан в регистрационных документах на эти транспортные средства. Применяют со знаками 5.15 для распространения действия знака на транспортные средства с экологическим классом, соответствующим или выше указанного на табличке, или, экологический класс которых не указан в регистрационных документах на эти транспортные средства.","7.6.1 - 7.6.18 \"Способ постановки транспортного средства на стоянку\". 7.6.1 указывает, что все транспортные средства должны быть поставлены на проезжей части вдоль тротуара; 7.6.2 - 7.6.10 указывают способ постановки легковых автомобилей и мотоциклов на околотротуарной стоянке. Применяются со знаком 5.15.","7.6.2-7.6.18 указывают способ постановки легковых автомобилей и мотоциклов.","5.8.4а \"Начало полосы\".","7.4.1 - 7.4.8 \"Вид транспортного средства\". Указывают вид транспортного средства, на который распространяется действие знака.","Табличка 7.4.1 распространяет действие знака на грузовые автомобили, а табличка 7.4.2 в том числе и с прицепом, с разрешенной максимальной массой более 3,5 тонн, табличка 7.4.3 - на легковые автомобили, а также грузовые автомобили с разрешенной максимальной массой до 3,5 тонн, табличка 7.4.8 - на транспортные средства, оборудованные опознавательными знаками \"Опасный груз\".","3.7 \"Движение транспортных средств с прицепом запрещено\". Запрещается движение грузовых автомобилей и тракторов с прицепами любого типа, а также буксировка механических транспортных средств.","Знаки 3.2 - 3.9, 3.32 и 3.33 запрещают движение соответствующих видов транспортных средств в обоих направлениях.","3.2 - 3.8 - на транспортные средства, которые обслуживают предприятия, находящиеся в обозначенной зоне, а также обслуживают граждан или принадлежат гражданам, проживающим или работающим в обозначенной зоне. В этих случаях транспортные средства должны въезжать в обозначенную зону и выезжать из нее на ближайшем к месту назначения перекрестке;","1.4.1 - 1.4.6 \"Приближение к железнодорожному переезду\". Дополнительное предупреждение о приближении к железнодорожному переезду вне населенных пунктов.","Знаки 1.4.1 - 1.4.3 устанавливаются с правой стороны дороги, а знаки 1.4.4 - 1.4.6 - с левой. Знаки 1.4.1 и 1.4.4 - под первым по ходу движения знаком 1.1 или 1.2, знаки 1.4.3 и 1.4.6 - под вторым знаком 1.1 или 1.2, а знаки 1.4.2 и 1.4.5 - самостоятельно, на равном расстоянии между первым и вторым знаком 1.1 или 1.2.","Примечание. Нумерация дорожных знаков соответствует СТ РК 1125. Наименования и изображения дорожных знаков приведены на рис. 2. Изображения дорожных знаков 4.1.2 и 4.1.3 изменены в соответствии с СТ РК 1125, предыдущие изображения данных дорожных знаков действуют до их замены.","3.13 \"Ограничение высоты\". Запрещается движение транспортных средств, габаритная высота которых (с грузом или без груза) больше указанной на знаке.","Знак 5.20.1 применяется также для указания объезда участков дорог, на которых установлен один из запрещающих знаков 3.11 - 3.15.","2.3.2, 2.3.3, 2.3.4, 2.3.5, 2.3.6 и 2.3.7 \"Примыкание второстепенной дороги\". Примыкание справа - 2.3.2, 2.3.4 и 2.3.6 слева - 2.3.3, 2.3.5 и 2.3.7.","4.9.1, 4.9.2, 4.9.3 \"Направление движения транспортных средств с опасными грузами\". Движение транспортных средств, оборудованных опознавательными знаками \"Опасный груз\", разрешается только в направлении, указанном на знаке: 4.9.1 - направо, 4.9.2 - налево, 4.9.3 - прямо.","7.19 \"Класс опасного груза\". Указывает номер класса (классов) опасных грузов. Применяется со знаками 3.32, 4.9.1 -4.9.3.","4.7 \"Ограничение минимальной скорости\". Разрешается движение только с указанной или большей скоростью (км/ч).","Если на знаке, установленном перед дополнительной полосой, изображен знак 4.7 \"Ограничение минимальной скорости\", то водитель транспортного средства, который не может продолжать движение по основной полосе с указанной или большей скоростью, перестраивается на дополнительную полосу.","5.8.6г, 5.8.6д \"Конец параллельной проезжей части\". Информируют водителей о и приоритетах движения при слиянии параллельных проезжих частей.","5.19.1 - 5.19.3 \"Тупик\". Дорога, не имеющая сквозной проезд.","6.14 \"Полиция\".","4.5 \"Велосипедная дорожка или велосипедная полоса движения\". Разрешается движение только на велосипедах, электрических самокатах и малых электрических транспортных средствах.","1.31.3 \"Направление поворота\". Направления движения на Т-образном перекрестке или разветвлении дорог. Направления объезда ремонтируемого участка дороги.","7.5.1 \"Субботние, воскресные и праздничные дни\", 7.5.2 \"Рабочие дни\", 7.5.3 \"Дни недели\". Указывают дни недели, в течение которых действует знак.","7.10 \"Место для осмотра автомобилей\". Указывает, что на площадке, обозначенной знаком 5.15 или 6.11, имеется эстакада или смотровая канава.","5.30.1 - 5.30.5 \"Направление движения для грузовых автомобилей\". Рекомендуемое направление движения для грузовых автомобилей, тракторов и самоходных машин, если на перекрестке их движение в одном из направлений запрещено.","1.2 \"Железнодорожный переезд без шлагбаума\".","Вне населенных пунктов знаки 1.1, 1.2, 1.9, 1.10, 1.21 и 1.23 повторяются. Второй знак устанавливается на расстоянии не менее 50 м до начала опасного участка.","1.7 \"Пересечение с круговым движением\".","1.1\"Железнодорожный переезд со шлагбаумом\".","5.9.2 - 5.9.4 \"Знаки направления движения для общественного транспорта\". Указывает направление движения маршрутных транспортных средств, другого общественного транспорта и иных транспортных средств категории М3, по полосе для маршрутных транспортных средств перед перекрестком в случаях, когда в прямом направлении движение невозможно.","Если на знаке 5.8.1 изображен знак 5.9.1 – 5.9.4, то его действие этих знаков распространяется на указанную полосу.","1.15 \"Скользкая дорога\". Участок дороги с повышенной скользкостью проезжей части.","5.45 \"Конец зоны с ограничениями стоянки\".","7.5.4 \"Время действия\". Указывает время суток, в течение которого действует знак.","7.5.5 - 7.5.7 \"Время действия\". Указывают дни недели и время суток, в течение которых действует знак.","3.21 \"Конец зоны запрещения обгона\".","3.27 \"Остановка запрещена\". Запрещаются остановка и стоянка транспортных средств.","3.31 \"Конец зоны всех ограничений\". Обозначение конца зоны действия одновременно несколькими знаками из следующих: 3.16, 3.20, 3.22, 3.24, 3.26 - 3.30.","3.1 - 3.3, 3.18.1, 3.18.2, 3.19, 3.27 - на маршрутные транспортные средства;","Зона действия знаков 3.16, 3.20, 3.22, 3.24, 3.26 - 3.30 распространяется от места установки знака до ближайшего перекрестка за ним, а в населенных пунктах при отсутствии перекрестка - до конца населенного пункта.","для знаков 3.27 - 3.30 установкой в конце зоны их действия повторных знаков 3.27 - 3.30 с табличкой 7.2.3 или применением таблички 7.2.2. Знак 3.27 может быть применен совместно с разметкой 1.4, а знак 3.28 - с разметкой 1.10, при этом зона действия знаков определяется протяженностью линии разметки.","Действие знаков 3.10, 3.27 - 3.30 распространяется только на ту сторону дороги, на которой они установлены.","7.2.2 - 7.2.6 \"Зона действия\". 7.2.2 указывает зону действия запрещающих знаков 3.27 - 3.30; 7.2.3 указывает конец зоны действия знаков 3.27-3.30; 7.2.4 информирует водителей о нахождении их в зоне действия знаков 3.27 - 3.30; 7.2.5, 7.2.6 указывают направление и зону действия знаков 3.27 - 3.30 при запрещении остановки или стоянки вдоль одной стороны площади, фасада здания и тому подобного.","Табличка 7.21 применяется совместно с запрещающими знаками 3.27-3.30, информирует о задержании транспортного средства и помещении его на специализированную стоянку.","5.36 \"Конец реверсивного движения\".","Таблички размещаются непосредственно под знаком, с которым они применены. Таблички 7.2.2 - 7.2.4, 7.13 при расположении знаков над проезжей частью, обочиной или тротуаром размещаются сбоку от знака.","5.20.2 \"Предварительный указатель направления\". Направления движения к обозначенным на знаке населенным пунктам и другим объектам. На знаках могут быть нанесены изображения знака 5.29.1, символы автомагистрали, аэропорта, спортивные и иные пиктограммы. На знаке 5.20.1 могут быть нанесены изображения других знаков, информирующих об особенностях движения. В нижней части знака 5.20.1 указывается расстояние от места установки знака до перекрестка или начала полосы торможения.","5.28 \"Километровый знак\". Расстояние до начала или конца дороги (км). 5.29.1, 5.29.2 \"Номер маршрута\". 5.29.1 - номер, присвоенный дороге (маршруту); 5.29.2 - номер и направление дороги (маршрута).","3.29 \"Стоянка запрещена по нечетным числам месяца\".","3.30 \"Стоянка запрещена по четным числам месяца\". При одновременном применении знаков 3.29 и 3.30 время перестановки транспортных средств с одной стороны на другую - с 19 до 21 часа.","3.28 - 3.30 - на такси с включенным таксометром;","3.2, 3.3, 3.28 - 3.30 – на транспортные средства, управляемые лицами с инвалидностью первой и второй групп, а также третьей группы с нарушениями опорно-двигательного аппарата или перевозящие лиц с такими группами инвалидности.","5.22а \"Начало населенного пункта\".","1.6 \"Пересечение равнозначных дорог\".","1.30 \"Прочие опасности\". Участок дороги, на котором имеются опасности, не предусмотренные другими предупреждающими знаками.","6.16 \"Зона радиосвязи с аварийными службами\".","6.18 \"Туалет\".","5.8.9 \"Ограничение скорости, действующее на различных полосах движения\".","5.11.1 \"Место для разворота\". Поворот налево запрещается.","1.32.1, 1.32.2 и 1.32.3 \"Объезд препятствия\".","7.21 \"Работает эвакуатор\".","5.32.1 - 5.32.3 \"Направление объезда\". Направление участка дороги, временно закрытого для движения.","1.18.1 - 1.18.3 \"Сужение дороги\". Сужение с обеих сторон - 1.18.1, справа - 1.18.2, слева - 1.18.3.","3.5 \"Движение мотоциклов запрещено\". Запрещается движение мотоциклов и мопедов.","3.22 \"Обгон грузовым автомобилям запрещен\". Запрещается грузовым автомобилям с разрешенной максимальной массой более 3,5 т обгон всех транспортных средств, кроме одиночных, движущихся со скоростью менее 30 км/ч. Тракторам запрещается обгон всех транспортных средств, кроме гужевых повозок и велосипедов.","7.18 \"Кроме лиц с инвалидностью\". Указывает, что действие знаков не распространяется на мотоколяски и автомобили, на которых установлены опознавательные знаки \"Лицо с инвалидностью\".","5.6 \"Конец дороги с односторонним движением\".","6.20 \"Экологический контроль\".","3.17.2 \"Опасность\". Запрещается дальнейшее движение всех без исключения транспортных средств в связи с дорожно-транспортным происшествием, аварией или другой опасностью.","5.17.3, 5.17.4 \"Надземный пешеходный переход\".","5.34.1, 5.34.2 \"Предварительный указатель перестроения на другую проезжую часть\". Направление объезда закрытого для движения участка проезжей части на дороге с разделительной полосой или направление движения для возвращения на правую проезжую часть.","1.20 \"Пешеходный переход\". Пешеходный переход, обозначенный знаками 5.16.1, 5.16.2 и (или) разметками 1.14.1 - 1.14.3.","7.15 \"Пешеходы с полной потерей зрения\". Указывает, что пешеходным переходом пользуются лица с полной потерей зрения. Применяется со знаками 1.20, 5.16.1, 5.16.2 и светофорами.","1.16 \"Неровная дорога\". Участок дороги, имеющий неровности на проезжей части (волнистость, выбоины, неплавные сопряжения с мостами и тому подобное).","5.3 \"Дорога для автомобилей\". Дорога, предназначенная для движения только автомобилей и мотоциклов.","1.9 \"Разводной мост\". Разводной мост или паромная переправа.","1.31.4, 1.31.5 \"Направление поворота\".","1.12.1, 1.12.2 \"Опасные повороты\". Участок дороги с опасными поворотами: 1.12.1 - с первым поворотом направо, 1.12.2 - с первым поворотом налево.","5.17.1, 5.17.2 \"Подземный пешеходный переход\".","1.24 \"Перегон скота\".","2.4 \"Уступите дорогу\". Водитель уступает дорогу транспортным средствам, движущимся по пересекаемой дороге, а при наличии таблички 7.13 - по главной.","7.1.2 \"Расстояние до объекта\". Указывает расстояние от знака 2.4 до перекрестка в случае, если непосредственно перед перекрестком установлен знак 2.5.","5.21.1 \"Указатель направления\", 5.21.2 \"Указатель направлений\". Направления движения к пунктам маршрута. На знаках может быть указано расстояние до обозначенных на нем объектов (км), нанесены символы автомагистрали, аэропорта, спортивные и иные пиктограммы.","На знаках 5.20.1, 5.20.2, 5.21.1 и 5.21.2, установленных вне населенного пункта, зеленый или синий фон означает, что движение к указанному населенному пункту или объекту будет осуществляться соответственно по автомагистрали или другой дороге. На знаках 5.20.1, 5.20.2, 5.21.1 и 5.21.2, установленных в населенном пункте, зеленый или синий фон означает, что движение к указанному населенному пункту или объекту после выезда из данного населенного пункта будет осуществляться соответственно по автомагистрали или другой дороге; белый фон означает, что указанный объект находится в данном населенном пункте.","3.17.3 \"Контроль\". Запрещается проезд без остановки через контрольные пункты.","4.2.1 \"Объезд препятствия справа\", 4.2.2 \"Объезд препятствия слева\". Объезд разрешается только со стороны, указанной стрелкой.","5.13 \"Место остановки трамвая\".","5.23 \"Конец населенного пункта\". Место, с которого на данной дороге утрачивают силу требования настоящих Правил, устанавливающие порядок движения в населенных пунктах.","6.3а \"Автозаправочная станция на сниженном нефтяном газе\".","1.17 \"Выброс гравия\". Участок дороги, на котором возможен выброс гравия, щебня и тому подобного из-под колес транспортных средств.","5.8.4 \"Начало полосы\". Начало участка средней полосы трехполосной дороги, предназначенного для движения в данном направлении.","5.40 \"Общие ограничения максимальной скорости\".","2.6 \"Преимущество встречного движения\". Запрещается въезд на узкий участок дороги, если это может затруднить встречное движение. Водитель уступает дорогу встречным транспортным средствам, находящимся на узком участке или противоположном подъезде к нему.","5.48 \"Пешеходная зона\". Место, с которого начинается территория (участок дороги), на которой разрешено движение только пешеходов.","5.18.2 \"Конец зоны действия знака \"Рекомендуемая скорость\".","5.20.3 \"Схема движения\". Маршрут движения при запрещении на перекрестке отдельных маневров или разрешенные направления движения на сложном перекрестке.","5.8.6 \"Конец полосы\". Конец участка средней полосы на трехполосной дороге, предназначенного для движения в данном направлении.","3.18.1 \"Поворот направо запрещен\".","Действие знаков 3.18.1, 3.18.2 распространяется на пересечение проезжих частей, перед которым установлен знак.","7.21.1 \"Вид маршрутного транспортного средства.","5.8.7, 5.8.8 \"Направление движения по полосам\".","Если на знаке 5.8.7 изображен знак, запрещающий движение каким-либо транспортным средствам, то движение этих транспортных средств по соответствующей полосе запрещается.","Знаки 5.8.7 и 5.8.8 с соответствующим числом стрелок могут применяться на дорогах с четырьмя полосами и более.","С помощью знаков 5.8.7 и 5.8.8 со сменным изображением может быть организовано реверсивное движение.","3.8 \"Движение гужевых повозок запрещено\". Запрещается движение гужевых повозок (саней), верховых и вьючных животных, а также прогон скота.","1.3.1 \"Однопутная железная дорога\".","1.3.2 \"Многопутная железная дорога\". Обозначение необорудованного шлагбаумом переезда через железную дорогу: 1.3.1 - с одним путем, 1.3.2 – с двумя путями и более.","Знаки 1.3.1 и 1.3.2 устанавливаются непосредственно перед железнодорожным переездом.","2.1 \"Главная дорога\". Дорога, на которой предоставлено право преимуществ венного проезда нерегулируемых перекрестков.","5.7.1, 5.7.2 \"Выезд на дорогу с односторонним движением\". Выезд на дорогу или проезжую часть с односторонним движением.","7.27 \"Кроме вида транспортного средства\". Не распространяется на электрические самокаты.","5.46 \"Зона с ограничением максимальной скорости\". Место, с которого начинается территория (участок дороги), где ограничена максимальная скорость движения.","5.44 \"Зона с ограничениями стоянки\". Место, с которого начинается территория (участок дороги), где стоянка запрещена.","5.47 \"Конец зоны с ограничением максимальной скорости\".","7.13 \"Направление главной дороги\". Указывает направление главной дороги на перекрестке.","2.5 \"Движение без остановки запрещено\". Запрещается движение без остановки перед стоп-линией, а если ее нет - перед краем пересекаемой проезжей части. Водитель уступает дорогу транспортным средствам, движущимся по пересекаемой дороге, а при наличии таблички 7.13 – по главной.","6.9 \"Гостиница или мотель\".","5.51 \"Конец зоны с ограничением экологического класса механических транспортных средств\".","5.12 \"Место остановки автобуса и (или) троллейбуса\".","6.11 \"Место отдыха\".","5.24 \"Начало населенного пункта\". Наименование и начало населенного пункта, в котором на данной дороге не действуют требования настоящих Правил, устанавливающие порядок движения в населенных пунктах.","5.25 \"Конец населенного пункта\". Конец населенного пункта, обозначенного знаком 5.24.","5.5 \"Дорога с односторонним движением\". Дорога или проезжая часть, по которой движение транспортных средств по всей ширине осуществляется в одном направлении.","5.20.1 \"Предварительный указатель направлений\".","3.15 \"Ограничение длины\". Запрещается движение транспортных средств (составов транспортных средств), габаритная длина которых (с грузом или без груза) больше указанной на знаке.","7.24 \"Экологический класс транспортного средства\".","3.19 \"Разворот запрещен\".","5.10.5 \"Дорога с полосой для велосипедистов\". Движение велосипедов осуществляется по велосипедной полосе навстречу общему потоку транспортных средств.","5.8.1 \"Направления движения по полосам\". Число полос и разрешенные направления движения на каждой из них.","Знаки 5.8.1 и 5.8.2, разрешающие поворот налево из крайней левой полосы, разрешают и разворот с этой полосы.","Действие знаков 5.8.1 и 5.8.2, установленных перед перекрестком, распространяется на весь перекресток, если другие знаки 5.8.1 и 5.8.2, установленные на нем, не дают иных указаний.","Если на знаке 5.8.1, 5.8.2, 5.8.2а изображен знак, запрещающий движение каким-либо транспортным средствам, то движение этих транспортных средств по соответствующей полосе запрещается.","5.31 \"Схема объезда\". Маршрут объезда участка дороги, временно закрытого для движения.","3.3 \"Движение механических транспортных средств запрещено\".","3.10 \"Движение пешеходов запрещено\".","2.2 \"Конец главной дороги\".","5.2 \"Конец автомагистрали\".","1.5 \"Пересечение с трамвайной линией\".","5.8.2а \"Направление движения по полосе\".","7.1.3, 7.1.4 \"Расстояние до объекта\". Указывает расстояние до объекта, находящегося в стороне от дороги.","5.16.1, 5.16.2 \"Пешеходный переход\".","При отсутствии на переходе разметок 1.14.1 - 1.14.3 знак 5.16.2 устанавливается справа от дороги на ближней границе перехода, а знак 5.16.1 - слева от дороги на дальней границе перехода.","5.41 \"Площадка для аварийной остановки\".","6.10 \"Кемпинг\".","3.2 \"Движение запрещено\". Запрещается движение всех транспортных средств.","3.20 \"Обгон запрещен\". Запрещается обгон всех транспортных средств, кроме одиночных, движущихся со скоростью менее 30 км/ч.","4.3 \"Круговое движение\". Разрешается движение в указанном стрелками направлении.","7.3.1 - 7.3.3 \"Направления действия\". Указывают направления действия знаков, установленных перед перекрестком, или направления движения к обозначенным объектам, находящимся непосредственно у дороги.","5.39 \"Конец жилой зоны\".","3.6 \"Движение тракторов запрещено\". Запрещается движение тракторов и самоходных машин.","3.12 \"Ограничение нагрузки на ось\". Запрещается движение транспортных средств, у которых фактическая нагрузка на какую-либо ось больше указанной на знаке.","3.9.1. \"Движение на электрических самокатах запрещено\". Запрещается движение только электрических самокатов.","6.12 \"Пост дорожной полиции\".","3.14 \"Ограничение ширины\". Запрещается движение транспортных средств, габаритная ширина которых (с грузом или без груза) больше указанной на знаке.","7.26 \"Вид транспортного средства\". Распространяется на электрические самокаты.","1.33 \"Опасная обочина\".","6.4 \"Техническое обслуживание автомобилей\".","3.4 \"Движение грузовых автомобилей запрещено\". Запрещается движение грузовых автомобилей и составов транспортных средств с разрешенной максимальной массой более 3,5 т (если на знаке не указана масса) или разрешенной максимальной массой, более указанной на знаке, а также тракторов и самоходных машин.","Знак 3.4 не запрещает движение грузовых автомобилей с наклонной белой полосой на бортах или предназначенных для перевозки людей.","6.6 \"Телефон\".","3.9 \"Движение на велосипедах запрещено\". Запрещается движение велосипедов, электрических самокатов и малых электрических транспортных средств.","1.11.1, 1.11.2 \"Опасный поворот\". Закругление дороги малого радиуса или с ограниченной видимостью: 1.11.1- направо, 1.11.2 - налево.","5.16.3 \"Диагональный пешеходный переход\".","1.13 \"Крутой спуск\".","3.24 \"Ограничение максимальной скорости\". Запрещается движение со скоростью (км/ч), превышающей указанную на знаке.","Если вводимое на данном участке дороги ограничение максимальной скорости более чем на 20 км/ч отличается от допускаемой скорости движения на предшествующем участке, применяется ступенчатое ограничение скорости с шагом не более 20 км/ч путем последовательной установки знаков 3.24, удаленных друг от друга на расстоянии от 100 метров до 150 метров.","Действие знака 3.24, установленного перед населенным пунктом, обозначенным знаком 5.22, распространяется до этого знака.","7.4.8а \"Вид маршрутного транспортного средства\".","5.38 \"Жилая зона\". Территория, на которой действуют требования настоящих Правил, устанавливающие порядок движения в жилой зоне.","1.25 \"Дикие животные\".","7.17 \"Лица с инвалидностью\". Указывает, что действие знака 5.15 распространяется только на мотоколяски и автомобили, на которых установлены опознавательные знаки \"Лицо с инвалидностью\".","1.31.1, 1.31.2 \"Направление поворота\". Направление движения на закруглении дороги малого радиуса с ограниченной видимостью. Направление объезда ремонтируемого участка дороги.","4.5.4, 4.5.5 \"Пешеходная и велосипедная дорожка с разделением движения\". Дорожки, предназначенные для совместного движения пешеходов, велосипедов, электрических самокатов, малых электрических транспортных средств, когда потоки пешеходов, велосипедов, электрических самокатов, малых электрических транспортных средств разделяются на самостоятельные потоки.","3.16 \"Ограничение минимальной дистанции\". Запрещается движение транспортных средств с дистанцией между ними меньше указанной на знаке.","5.23а \"Конец населенного пункта\".","6.17 \"Бассейн или пляж\".","3.17.1 \"Таможня\". Запрещается проезд без остановки у таможни (контрольного пункта).","7.16 \"Влажное покрытие\". Указывает, что действие знака распространяется на период времени, когда покрытие проезжей части влажное.","7.22 \"Вид транспортного средства\". Распространяется на электромобили и гибридные автомобили, имеющие возможность зарядки от внешнего источника.","1.10 \"Выезд на набережную\". Выезд на набережную или берег.","Действие знака 4.1.1, установленного в начале участка дороги, распространяется до ближайшего перекрестка. Знак не запрещает поворот направо на прилегающие территории.","1.26 \"Падение камней\". Участок дороги, на котором возможны обвалы, оползни, падение камней.","5.49 \"Конец пешеходной зоны\".","5.15 \"Место стоянки\".","7.4.8 б \"Туристический автобус\". Применяют со знаком 5.15 \"Место стоянки\" для указания площадки для стоянки туристического автобуса и посадки в него (высадки из него) туристов.","7.7 \"Стоянка с неработающим двигателем\". Указывает, что на стоянке, обозначенной знаком 5.15, разрешается стоянка транспортных средств только с неработающим двигателем.","7.9 \"Ограничение продолжительности стоянки\". Указывает максимальную продолжительность пребывания транспортного средства на стоянке, обозначенной знаком 5.15.","1.19 \"Двустороннее движение\". Начало участка дороги (проезжей части) с встречным движением.","5.1 \"Автомагистраль\". Дорога, на которой действуют требования настоящих Правил, устанавливающие порядок движения по автомагистралям.","5.10.8, 5.10.9 \"Выезд на дорогу с полосой для велосипедистов\".","7.8 \"Платные услуги\". Указывает, что услуги предоставляются только за оплату.","5.33 \"Стоп-линия\". Место остановки транспортных средств при запрещающем сигнале светофора (регулировщика).","5.9.1 \"Конец полосы для маршрутных транспортных средств\". Конец полосы, предназначенной для движения маршрутных транспортных средств, другого общественного транспорта и иных транспортных средств категории М3, движущихся попутно общему потоку транспортных средств.","7.23 \"Кроме вида транспортного средства\". Не распространяется на электромобили и гибридные автомобили, имеющие возможность зарядки от внешнего источника.","6.5 \"Мойка автомобилей\".","6.7 \"Пункт питания\".","5.27 \"Указатель расстояний\". Расстояние до населенных пунктов (км), расположенных на маршруте.","5.10.7 \"Конец дороги с полосой для велосипедистов\".","Табличка 7.11 \"Ограничение разрешенной максимальной (полной) массы\". Указывает, что действие знака распространяется только на транспортные средства с разрешенной максимальной (полной) массой, более указанной на табличке.","5.10.1 \"Дорога с полосой для маршрутных транспортных средств\". Дорога, по которой движение маршрутных транспортных средств, другого общественного транспорта и иных транспортных средств категории М3, осуществляется по специально выделенной полосе навстречу общему потоку транспортных средств.","4.5.1 \"Конец велосипедной дорожки или велосипедной полосы движения\".","7.14 \"Полоса движения\". Указывает полосу движения, на которую распространяется действие знака или светофора.","1.29 \"Тоннель\". Тоннель, в котором отсутствует искусственное освещение, или тоннель, видимость въездного портала которого ограничена.","5.35 \"Реверсивное движение\". Начало участка дороги, на котором на одной или нескольких полосах направление движения может изменяться на противоположное.","3.25 \"Конец зоны ограничения максимальной скорости\".","5.22 \"Начало населенного пункта\". Наименование и начало населенного пункта, в котором действуют требования настоящих Правил, устанавливающие порядок движения в населенных пунктах.","Ступенчатое ограничение скорости не применяется перед населенными пунктами, обозначенными знаками 5.22, если видимость знаков составляет не менее 150 метров.","6.1 \"Пункт первой медицинской помощи\".","5.11.2 \"Зона для разворота\". Протяженность зоны для разворота. Поворот налево запрещается.","6.8 \"Питьевая вода\".","6.3б \"Автозаправочная станция на сжатом природном газе\".","5.10.4 \"Конец дороги с полосой для маршрутных транспортных средств\".","7.1.1 \"Расстояние до объекта\". Указывает расстояние от знака до начала опасного участка, места введения соответствующего ограничения или определенного объекта (места), находящегося впереди по ходу движения.","Знак 1.23 при проведении краткосрочных работ на проезжей части может быть установлен (без таблички 7.1.1) на расстоянии 10 - 15 м до места проведения работ.","7.25 \"Зарядка электромобилей\".","3.18.2 \"Поворот налево запрещен\".","5.9 \"Полоса для маршрутных транспортных средств\". Полоса, предназначенная для движения маршрутных транспортных средств, другого общественного транспорта и иных транспортных средств категории М3, движущихся попутно общему потоку транспортных средств.","5.8.3 \"Начало полосы\". Начало дополнительной полосы на подъеме или полосы торможения.","1.8 \"Светофорное регулирование\". Перекресток, пешеходный переход или участок дороги, движение на котором регулируется светофором.","4.6 \"Пешеходная дорожка\". Разрешается движение только пешеходам.","4.4 \"Движение легковых автомобилей\". Разрешается движение легковых автомобилей, автобусов, мотоциклов, маршрутных транспортных средств и грузовых автомобилей, разрешенная максимальная масса которых не превышает 3,5 тонн.","5.42 \"Фотовидеофиксация\". Осуществляется фиксация нарушений настоящих Правил стационарным сертифицированным техническим средством и прибором, при этом установка знака необязательна.","1.28 \"Низколетящие самолеты\".","5.26 \"Наименование объекта\". Наименование объекта иного, чем населенный пункт (река, озеро, перевал, достопримечательность и тому подобное).","2.7 \"Преимущество перед встречным движением\". Узкий участок дороги, при движении по которому водитель пользуется преимуществом по отношению к встречным транспортным средствам.","3.28 \"Стоянка запрещена\". Запрещается стоянка транспортных средств.","Знак 2.5 может быть установлен перед железнодорожным переездом или карантинным постом. В этих случаях водитель останавливается перед стоп-линией, а при ее отсутствии - перед знаком.","4.8 \"Конец зоны ограничения минимальной скорости\".","3.32 \"Движение транспортных средств с опасными грузами запрещено\". Запрещается движение транспортных средств, оборудованных опознавательными знаками \"Опасный груз\".","5.50 \"Зона с ограничением экологического класса механических транспортных средств\". Запрещается движение механических транспортных средств или вида(ов) транспортного средства, экологический класс которых ниже экологического класса, указанного на знаке, или экологический класс которых не указан в регистрационных документах на эти транспортные средства.","6.15 \"Зона приема радиостанции, передающей информацию о дорожном движении\".","3.11 \"Ограничение массы\". Запрещается движение транспортных средств, в том числе составов транспортных средств, общая фактическая масса которых больше указанной на знаке.","5.8.2 \"Направления движения по полосе\". Разрешенные направления движения по полосе.","5.4 \"Конец дороги для автомобилей\".","1.22 \"Пересечение с велосипедной дорожкой\".","1.23 \"Дорожные работы\".","5.8.3а \"Обязательная минимальная скорость на различных полосах движения\".","3.26 \"Подача звукового сигнала запрещена\". Запрещается пользоваться звуковыми сигналами, кроме тех случаев, когда сигнал подается для предотвращения дорожно-транспортного происшествия.","5.14 \"Место стоянки легковых такси\".","1.27 \"Боковой ветер\".","3.1 \"Въезд запрещен\". Запрещается въезд всех транспортных средств в данном направлении.","6.13 \"Пост транспортного контроля\".","6.3 \"Автозаправочная станция\".","5.18.1. Рекомендуемая скорость. Скорость, с которой рекомендуется движение на данном участке дороги. Зона действия знака распространяется до ближайшего перекрестка, а при применении знака 5.18.1. совместно с предупреждающим знаком определяется протяженностью опасного участка.","5.8.5 \"Конец полосы\". Конец дополнительной полосы на подъеме или полосы разгона.","1.21 \"Дети\". Участок дороги вблизи детского учреждения (школы, оздоровительного лагеря и тому подобного), на проезжей части которого возможно появление детей.","1.34 \"Затор\".","5.8.8а \"Направления движения по полосам\".","5.37 \"Выезд на дорогу с реверсивным движением\".","2.6 - обозначает боковые поверхности ограждений дорог на других участках;","1.11 - разделяет транспортные потоки противоположных или попутных направлений на участках дорог, где перестроение разрешено только из одной полосы; обозначает места, предназначенные для разворота, въезда и выезда со стояночных площадок и тому подобного, где движение разрешено только в одну сторону;","1.6 (линия приближения - прерывистая линия, у которой длина штрихов в 3 раза превышает промежутки между ними) - предупреждает о приближении к разметке 1.1 или 1.11, которая разделяет транспортные потоки противоположных или попутных направлений;","1.19 - предупреждает о приближении к сужению проезжей части (участку, где уменьшается количество полос движения в данном направлении) или линиям разметки 1.1 или 1.11, разделяющим транспортные потоки противоположных направлений. В первом случае разметка 1.19 может применяться в сочетании со знаками 1.18.1 - 1.18.3;","Линию 1.11 разрешается пересекать со стороны прерывистой, а также и со стороны сплошной, но только при завершении обгона или объезда.","1.2 (широкая сплошная линия) - обозначает край проезжей части на автомагистралях;","Линии 1.1 - 1.3 пересекать запрещается.","Допускается пересечение линий 1.1 и 1.2 для остановки транспортного средства на обочине, а линии 1.1 как исключение при объезде препятствия, если выполнить его невозможно, не прибегая к этому исключению.","1.18 - указывает разрешенные на перекрестке направления движения по полосам. Применяется самостоятельно или в сочетании со знаками 5.8.1, 5.8.2; разметка с изображением тупика наносится для указания того, что поворот на ближайшую проезжую часть запрещен; разметка, разрешающая поворот налево из крайней левой полосы, разрешает и разворот;","1.3 - разделяет транспортные потоки противоположных направлений на дорогах, имеющих четыре полосы движения и более;","2.4 - обозначает направляющие столбики, надолбы, опоры ограждений и тому подобное;","1.7 (прерывистая линия с короткими штрихами и равными им промежутками) - обозначает границы полос движения в пределах перекрестка;","Линии 1.5-1.8 пересекать разрешается с любой стороны.","1.13 - указывает место, где водитель должен при необходимости остановиться, уступая дорогу транспортным средствам, движущимся по пересекаемой дороге;","1.20 - предупреждает о приближении к разметке 1.13;","1.16.1 - 1.16.3 - обозначение направляющих островков в местах: 1.16.1 - разделение транспортных потоков противоположных направлений, 1.16.2 - разделение транспортных потоков одного направления, 1.16.3 - слияние транспортных потоков;","1.1 - разделяет транспортные потоки противоположных направлений и обозначает границы полос движения в опасных местах на дорогах; обозначает границы проезжей части, на которые въезд запрещен; обозначает границы стояночных мест транспортных средств и край проезжей части дорог, не отнесенных к автомагистралям (нумерация разметки соответствует СТ РК 1124. Наименование и изображение дорожной разметки приведены на рис. 3.);","1.15 - обозначает место, где велосипедная дорожка пересекает проезжую часть;","1.28 (разметка желтого цвета) - обозначает участок регулирования перекрестка.","1.14.1, 1.14.2 (\"зебра\") - обозначает нерегулируемый пешеходный переход; стрелы разметки 1.14.2 указывают направление движения пешеходов; 1.14.3 - обозначает пешеходный переход, где движение регулируется светофором;","2.7 - обозначает бордюры на опасных участках и возвышающиеся островки безопасности;","2.5 - обозначает боковые поверхности ограждений дорог на закруглениях малого радиуса, крутых спусках, других опасных участках;","1.12 (стоп-линия) - указывает место, где водитель останавливается при наличии знака 2.5 или при запрещающем сигнале светофора (регулировщика);","1.21 (надпись \"СТОП\") - предупреждает о приближении к разметке 1.12, когда она применяется в сочетании со знаком 2.5;","1.4 - обозначает места, где запрещена остановка. Применяется самостоятельно или в сочетании со знаком 3.27 и наносится у края проезжей части или по верху бордюра;","Горизонтальная разметка имеет белый, желтый цвет. Линии 1.4, 1.10 и 1.17 только желтого цвета.","Действие линии 1.4. не распространяется на маршрутные транспортные средства.","1.10 - обозначает места, где запрещена стоянка. Применяется самостоятельно или в сочетании со знаками 3.28 - 3.30 и наносится у края проезжей части или по верху бордюра;","Действие линии 1.10 не распространяется на транспортные средства, управляемые лицами с инвалидностью первой и второй групп, а также третьей группы с нарушениями опорно-двигательного аппарата или перевозящие лиц с такими группами инвалидности, и на такси с включенным таксометром.","1.9 - обозначает границы полос движения, на которых осуществляется реверсивное регулирование; разделяет транспортные потоки противоположных направлений (при выключенных реверсивных светофорах) на дорогах, где осуществляется реверсивное регулирование;","Линию 1.9 при отсутствии реверсивных светофоров или когда они отключены разрешается пересекать, если она расположена справа от водителя; при включенных реверсивных светофорах - с любой стороны, если она разделяет полосы, по которым движение разрешено в одном направлении. При отключении реверсивных светофоров водитель немедленно перестраивается вправо за линию разметки 1.9.","Линию 1.9, разделяющую транспортные потоки противоположных направлений, при выключенных реверсивных светофорах пересекать запрещается.","2.2 - обозначает нижний край пролетного строения тоннелей, мостов и путепроводов;","1.8 (широкая прерывистая линия) - обозначает границу между полосой разгона или торможения и основной полосой проезжей части (на перекрестках, пересечениях дорог на разных уровнях, в зоне автобусных остановок и тому подобное);","1.5 - разделяет транспортные потоки противоположных направлений на дорогах, имеющих две или три полосы; обозначает границы полос движения при наличии двух и более полос, предназначенных для движения в одном направлении;","2.1 - обозначает элементы дорожных сооружений (опор мостов, путепроводов, торцовых частей парапетов и тому подобного), когда эти элементы представляют опасность для движущихся транспортных средств;","2.3 - обозначает круглые тумбы, установленные на разделительных полосах или островках безопасности;","1.22 - указывает номер дороги (маршрута);","1.23 - обозначает специальную полосу для маршрутных транспортных средств, другого общественного транспорта и иных транспортных средств категории М3.","1.17- обозначает остановки маршрутных транспортных средств и стоянки такси;"],"k":{"590":{"title":"Статья 590. Нарушение правил эксплуатации транспортных средств","t":["1. Управление зарегистрированным транспортным средством с нечитаемыми или несоответствующими требованиям национального стандарта или установленными вне предусмотренных мест государственными регистрационными номерными знаками (знаком) –","влечет штраф в размере пяти месячных расчетных показателей.","2. Управление транспортным средством без государственных регистрационных номерных знаков (знака) или после запрещения его эксплуатации, или не зарегистрированным в установленном порядке –","влечет штраф в размере десяти месячных расчетных показателей.","2-1. Действие, предусмотренное частью второй настоящей статьи, совершенное повторно в течение года после наложения административного взыскания, –","влечет штраф в размере двадцати месячных расчетных показателей или лишение права управления транспортными средствами сроком на один год.","3. Установка на транспортном средстве заведомо подложных или поддельных государственных регистрационных номерных знаков (знака) –","влечет штраф на физических лиц в размере пятнадцати, на должностных лиц – в размере пятидесяти, на субъектов малого предпринимательства или некоммерческие организации – в размере ста, на субъектов среднего предпринимательства – в размере двухсот, на субъектов крупного предпринимательства – в размере четырехсот месячных расчетных показателей.","4. Управление транспортным средством с заведомо подложными или поддельными государственными регистрационными номерными знаками (знаком), а равно управление транспортным средством с государственными регистрационными номерными знаками, оборудованными с применением устройств и материалов, препятствующих идентификации государственных регистрационных номерных знаков (знака) либо позволяющих их видоизменить или скрыть, –","влечет административный арест до пяти суток и лишение права управления транспортными средствами на срок один год.","4-1. Действие, предусмотренное частью четвертой настоящей статьи, совершенное лицом, к которому административный арест в соответствии с частью второй статьи 50 настоящего Кодекса не применяется, –","влечет штраф в размере сорока месячных расчетных показателей и лишение права управления транспортными средствами сроком на один год.","5. Управление транспортными средствами, не отвечающими требованиям технических регламентов, национальных стандартов, а также при наличии неисправностей или условий, при которых запрещается эксплуатация транспортных средств, за исключением случаев, указанных в части шестой настоящей статьи, –","влечет штраф в размере пяти месячных расчетных показателей.","6. Управление транспортными средствами, имеющими неисправности","тормозной системы, рулевого управления, тягово-сцепного устройства, –","влечет штраф в размере пятнадцати месячных расчетных показателей.","7. Управление транспортным средством, переоборудованным без соответствующего разрешения, –","влечет штраф в размере пятнадцати месячных расчетных показателей.","8. Выпуск в эксплуатацию автотранспортных средств, не прошедших предрейсовый (предсменный) технический осмотр, а также допуск к управлению водителя, не прошедшего предрейсовый (предсменный) медицинский осмотр, при осуществлении регулярных или нерегулярных автомобильных перевозок пассажиров, багажа, а также перевозок грузов –","влекут штраф на должностных лиц и субъектов малого предпринимательства в размере тридцати, на субъектов среднего предпринимательства – в размере сорока, на субъектов крупного предпринимательства – в размере пятидесяти месячных расчетных показателей.","9. Управление транспортным средством, не прошедшим государственный или обязательный технический осмотр, –","влечет штраф в размере пяти месячных расчетных показателей.","10. Действия, предусмотренные частями первой, пятой, шестой, седьмой и девятой настоящей статьи, совершенные повторно в течение года после наложения административного взыскания, –","влекут штраф в размере двадцати месячных расчетных показателей.","Примечание. Под транспортными средствами в настоящей главе Кодекса следует понимать все виды автомобилей, тракторов и иные самоходные машины, трамваи, троллейбусы, а также мотоциклы и другие механические транспортные средства."]},"591":{"title":"Статья 591. Пользование водителем при управлении транспортным средством телефоном либо радиостанцией","t":["1. Пользование водителем при управлении транспортным средством телефоном либо радиостанцией –","влечет штраф в размере пяти месячных расчетных показателей.","2. Действие, предусмотренное частью первой настоящей статьи, совершенное повторно в течение года после наложения административного взыскания, –","влечет штраф в размере десяти месячных расчетных показателей.","Примечание. Во время управления транспортным средством разрешается пользоваться телефоном либо радиостанцией посредством применения наушников или громкой связи."]},"592":{"title":"Статья 592. Превышение установленной скорости движения","t":["1. Превышение установленной скорости движения транспортного средства на величину от десяти до двадцати километров в час –","влечет штраф в размере пяти месячных расчетных показателей.","2. Превышение установленной скорости движения транспортного средства на величину от двадцати до сорока километров в час –","влечет штраф в размере десяти месячных расчетных показателей.","3. Превышение установленной скорости движения транспортного средства на величину от сорока до шестидесяти километров в час –","влечет штраф в размере двадцати месячных расчетных показателей.","3-1. Превышение установленной скорости движения транспортного средства на величину от шестидесяти и более километров в час –","влечет штраф в размере сорока месячных расчетных показателей.","4. Действия, предусмотренные частями второй и третьей настоящей статьи, совершенные повторно в течение года после наложения административного взыскания, –","влекут штраф в размере тридцати месячных расчетных показателей.","5. Действие, предусмотренное частью 3-1 настоящей статьи, совершенное повторно в течение года после наложения административного взыскания, –","влечет штраф в размере шестидесяти месячных расчетных показателей."]},"593":{"title":"Статья 593. Несоблюдение требований по перевозке пассажиров и грузов, пользованию ремнями безопасности или мотошлемами, предусмотренных правилами дорожного движения","t":["1. Несоблюдение правил перевозки пассажиров и грузов, за исключением случаев, предусмотренных частью 1-2 настоящей статьи, –","влечет штраф в размере пяти месячных расчетных показателей.","1-1. Принудительная высадка из общественного транспорта лица, не достигшего шестнадцатилетнего возраста, следующего без сопровождения родителей и (или) его законного представителя, –","влечет штраф в размере пяти месячных расчетных показателей.","1-2. Перевозка пассажиров вне кабины (салона) транспортного средства, а равно допущение их высовывания в оконные проемы и люки транспортного средства, открывания дверей во время движения –","влекут штраф в размере десяти месячных расчетных показателей.","2. Несоблюдение правил пользования ремнями безопасности или мотошлемами –","влечет штраф в размере пяти месячных расчетных показателей.","3. Действия, предусмотренные частями первой и второй настоящей статьи, совершенные повторно в течение года после наложения административного взыскания, –","влекут штраф в размере десяти месячных расчетных показателей."]},"594":{"title":"Статья 594. Нарушение правил проезда перекрестков или пересечение проезжей части дороги","t":["1. Выезд на перекресток или пересечение проезжей части дороги в случае образовавшегося затора, который привел к созданию препятствия (затора) для движения транспортных средств в поперечном направлении, –","влечет предупреждение или штраф в размере трех месячных расчетных показателей.","2. Невыполнение требования правил дорожного движения уступить дорогу транспортному средству, пользующемуся преимущественным правом проезда перекрестков, –","влечет штраф в размере пятнадцати месячных расчетных показателей.","3. Исключен Законом РК от 28.12.2017 № 127-VI (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования).","4. Действия, предусмотренные частью первой настоящей статьи, совершенные повторно в течение года после наложения административного взыскания, –","влекут штраф в размере семи месячных расчетных показателей.","5. Действие, предусмотренное частью второй настоящей статьи, совершенное повторно в течение года после наложения административного взыскания, –","влечет штраф в размере двадцати месячных расчетных показателей."]},"595":{"title":"Статья 595. Нарушение правил маневрирования","t":["1. Невыполнение требования правил дорожного движения подать сигнал перед началом движения, перестроения, поворота, разворота или остановки –","влечет штраф в размере пяти месячных расчетных показателей.","2. Движение задним ходом в местах, где такие маневры запрещены, –","влечет штраф в размере десяти месячных расчетных показателей.","3. Невыполнение требования правил дорожного движения уступить дорогу транспортному средству, пользующемуся преимущественным правом движения, за исключением случаев, предусмотренных частью второй статьи 594 и статьей 598 настоящего Кодекса, –","влечет штраф в размере пятнадцати месячных расчетных показателей.","4. Действия, предусмотренные частями второй и третьей настоящей статьи, совершенные повторно в течение года после наложения административного взыскания, –","влекут штраф в размере двадцати месячных расчетных показателей."]},"596":{"title":"Статья 596. Нарушение правил расположения транспортного средства на проезжей части дороги, встречного разъезда или обгона","t":["1. Движение по пешеходным дорожкам, обочинам или тротуарам в нарушение правил дорожного движения –","влечет штраф в размере пятнадцати месячных расчетных показателей.","2. Нарушение правил расположения транспортного средства на проезжей части дороги, встречного разъезда или обгона, а равно пересечение организованной транспортной или пешей колонны либо занятие места в ней –","влекут штраф в размере пятнадцати месячных расчетных показателей.","3. Выезд на сторону проезжей части дороги, предназначенную для встречного движения, в случаях, если это запрещено правилами дорожного движения, в том числе сопряженный с разворотом или поворотом, –","влечет лишение права на управление транспортными средствами на срок шесть месяцев.","3-1. Действие, предусмотренное частью третьей настоящей статьи, совершенное лицами, к которым лишение специального права в соответствии с частью четвертой статьи 46 настоящего Кодекса не применяется, –","влечет штраф в размере тридцати месячных расчетных показателей.","4. Действия, предусмотренные частями первой и второй настоящей статьи, совершенные повторно в течение года после наложения административного взыскания, –","влекут штраф в размере тридцати месячных расчетных показателей.","4-1. Действие, предусмотренное частью третьей настоящей статьи, повлекшее повреждение транспортных средств, грузов, дорог, дорожных и иных сооружений либо иного имущества, причинившее материальный ущерб, –","влечет лишение права управления транспортными средствами на срок девять месяцев.","5. Действие, предусмотренное частью третьей настоящей статьи, совершенное лицом, лишенным либо не имеющим права управления транспортным средством, –","влечет штраф в размере пятидесяти месячных расчетных показателей."]},"597":{"title":"Статья 597. Нарушение правил остановки или стоянки транспортных средств","t":["1. Нарушение правил остановки или стоянки транспортных средств, в том числе в местах, оборудованных электрозарядными станциями, за исключением случаев, предусмотренных частями второй, третьей настоящей статьи, –","влечет штраф в размере пяти месячных расчетных показателей.","2. Нарушение правил остановки или стоянки транспортных средств на тротуаре, а также остановка или стоянка транспортных средств на клумбах, газонах, детской или спортивной площадке –","влекут штраф в размере десяти месячных расчетных показателей.","3. Нарушение правил остановки или стоянки транспортных средств на проезжей части, повлекшее создание препятствий для движения других транспортных средств, –","влечет штраф в размере десяти месячных расчетных показателей.","4. Нарушение правил остановки или стоянки транспортных средств в местах, отведенных для остановки или стоянки транспортных средств лиц с инвалидностью, –","влечет штраф в размере десяти месячных расчетных показателей.","4-1. Уклонение от уплаты за парковку в местах, определенных местными исполнительными органами городов Астаны и Алматы, –","влечет штраф в размере одного месячного расчетного показателя.","4-2. Действие, предусмотренное частью 4-1 настоящей статьи, совершенное повторно в течение года после наложения административного взыскания, –","влечет штраф в размере двух месячных расчетных показателей.","5. Действия, предусмотренные частью первой настоящей статьи, совершенные повторно в течение года после наложения административного взыскания, –","влекут штраф в размере десяти месячных расчетных показателей.","5-1. Действия, предусмотренные частями второй и третьей настоящей статьи, совершенные повторно в течение года после наложения административного взыскания, –","влекут штраф в размере пятнадцати месячных расчетных показателей.","6. Действие, предусмотренное частью четвертой настоящей статьи, совершенное повторно в течение года после наложения административного взыскания, –","влечет штраф в размере пятнадцати месячных расчетных показателей."]},"598":{"title":"Статья 598. Непредоставление преимущества в движении транспортному средству оперативных и специальных служб с включенными специальными световыми и звуковыми сигналами","t":["1. Непредоставление преимущества в движении транспортному средству оперативных и специальных служб, а равно имеющему нанесенные на наружные поверхности специальные цветографические схемы, надписи и обозначения с одновременно включенными проблесковым маячком и специальным звуковым сигналом –","влечет штраф в размере двадцати месячных расчетных показателей.","2. Действие, предусмотренное частью первой настоящей статьи, совершенное повторно в течение года после наложения административного взыскания, –","влечет штраф в размере сорока месячных расчетных показателей или привлечение к общественным работам на срок двадцать часов."]},"599":{"title":"Статья 599. Проезд на запрещающий сигнал светофора или на запрещающий жест регулировщика","t":["1. Проезд на запрещающий сигнал светофора или на запрещающий жест регулировщика, за исключением случаев, предусмотренных частью первой статьи 607 настоящего Кодекса, –","влечет штраф в размере десяти месячных расчетных показателей.","2. Действие, предусмотренное частью первой настоящей статьи, совершенное повторно в течение года после наложения административного взыскания, –","влечет штраф в размере пятнадцати месячных расчетных показателей."]},"600":{"title":"Статья 600. Непредоставление преимущества в движении пешеходам или иным участникам дорожного движения","t":["1. Невыполнение требований правил дорожного движения уступить дорогу пешеходам или иным участникам дорожного движения, за исключением водителей транспортных средств, пользующихся преимуществом в движении, –","влечет штраф в размере десяти месячных расчетных показателей.","2. Действие, предусмотренное частью первой настоящей статьи, совершенное повторно в течение года после наложения административного взыскания, –","влечет штраф в размере пятнадцати месячных расчетных показателей."]},"601":{"title":"Статья 601. Несоблюдение требований, предписанных дорожными знаками или разметкой проезжей части дороги","t":["1. Несоблюдение требований, предписанных дорожными знаками или разметкой проезжей части дороги, за исключением случаев, предусмотренных другими статьями настоящей главы, –","влечет штраф в размере трех месячных расчетных показателей.","2. Действие, предусмотренное частью первой настоящей статьи, совершенное повторно в течение года после наложения административного взыскания, –","влечет штраф в размере десяти месячных расчетных показателей."]},"602":{"title":"Статья 602. Нарушение водителями транспортных средств правил пользования внешними световыми приборами и (или) звуковыми сигналами, применения аварийной сигнализации","t":["1. Нарушение водителями транспортных средств правил пользования внешними световыми приборами в светлое время суток и (или) звуковыми сигналами –","влечет предупреждение.","1-1. Нарушение водителями транспортных средств правил пользования внешними световыми приборами в темное время суток или в условиях недостаточной видимости, применения аварийной сигнализации и знака аварийной остановки –","влечет штраф в размере пяти месячных расчетных показателей.","2. Действие, предусмотренное частью первой настоящей статьи, совершенное повторно в течение года после наложения административного взыскания, –","влекут штраф в размере пяти месячных расчетных показателей.","3. Действия, предусмотренные частью 1-1 настоящей статьи, совершенные повторно в течение года после наложения административного взыскания, –","влекут штраф в размере семи месячных расчетных показателей."]},"603":{"title":"Статья 603. Нарушение правил установки на транспортном средстве устройств для подачи специальных световых и (или) звуковых сигналов либо незаконное нанесение специальных цветографических схем автомобилей оперативных и специальных служб","t":["1. Установка на передней части транспортного средства световых приборов с огнями красного цвета или световозвращающих приспособлений красного цвета, а равно световых приборов, цвет и режим работы которых не соответствуют требованиям допуска транспортных средств к эксплуатации, –","влечет штраф на физических лиц в размере пятнадцати, на субъектов малого предпринимательства или некоммерческие организации – в размере семидесяти, на субъектов среднего предпринимательства – в размере ста пятидесяти, на субъектов крупного предпринимательства – в размере одной тысячи месячных расчетных показателей, с конфискацией указанных приборов и приспособлений.","2. Установка на транспортном средстве без соответствующего разрешения устройств для подачи специальных световых и (или) звуковых сигналов (за исключением охранной сигнализации) –","влечет штраф на физических лиц в размере двадцати пяти, на субъектов малого предпринимательства или некоммерческие организации – в размере ста, на субъектов среднего предпринимательства – в размере двухсот, на субъектов крупного предпринимательства – в размере одной тысячи месячных расчетных показателей, с конфискацией указанных устройств.","3. Незаконное нанесение на наружные поверхности транспортного средства специальных цветографических схем автомобилей оперативных и специальных служб -","влечет штраф на физических лиц в размере двадцати пяти, на субъектов малого предпринимательства или некоммерческие организации – в размере ста, на субъектов среднего предпринимательства – в размере двухсот, на субъектов крупного предпринимательства – в размере одной тысячи месячных расчетных показателей."]},"604":{"title":"Статья 604. Нарушение правил подготовки водителей транспортных средств","t":[]},"605":{"title":"Статья 605. Нарушение законодательства Республики Казахстан о дорожном движении","t":[]},"606":{"title":"Статья 606. Нарушение участником дорожного движения правил дорожного движения, повлекшее создание аварийной обстановки","t":["1. Нарушение участником дорожного движения правил дорожного движения, повлекшее создание аварийной обстановки, то есть вынудившее других участников движения резко изменить скорость, направление движения, –","влечет штраф в размере десяти месячных расчетных показателей.","2. Действие, предусмотренное частью первой настоящей статьи, совершенное повторно в течение года после наложения административного взыскания, –","влечет лишение права управления транспортным средством на срок шесть месяцев."]},"607":{"title":"Статья 607. Нарушение правил проезда железнодорожных переездов","t":["1. Пересечение железнодорожного пути вне железнодорожного переезда, выезд на железнодорожный переезд при закрытом или закрывающемся шлагбауме либо при запрещающем сигнале светофора или дежурного по переезду –","влекут штраф в размере двадцати месячных расчетных показателей.","2. Действия, предусмотренные частью первой настоящей статьи, совершенные повторно в течение года после наложения административного взыскания, –","влекут лишение права управления транспортным средством на срок шесть месяцев.","3. Действия, предусмотренные частями первой и второй настоящей статьи, повлекшие повреждение транспортных средств, грузов, дорожных и иных сооружений либо иного имущества, причинившие материальный ущерб, –","влекут лишение права управления транспортными средствами на срок девять месяцев."]},"608":{"title":"Статья 608. Управление транспортным средством водителем, находящимся в состоянии алкогольного, наркотического и (или) токсикоманического опьянения, а равно передача управления транспортным средством лицу, находящемуся в состоянии алкогольного, наркотического и (или) токсикоманического опьянения","t":["1. Управление транспортным средством водителем, находящимся в состоянии алкогольного, наркотического и (или) токсикоманического опьянения, а равно передача управления транспортным средством лицу, находящемуся в состоянии алкогольного, наркотического и (или) токсикоманического опьянения, –","влекут административный арест на пятнадцать суток и лишение права управления транспортным средством сроком на семь лет.","Нормативным постановлением Конституционного Суда РК от 27.10.2023 № 34-НП часть первая статьи 608 настоящего Кодекса РК признана соответствующей Конституции Республики Казахстан.","2. Исключен Законом РК от 27.12.2019 № 292-VІ (порядок введения в действие см. ст. 2).","3. Действия, предусмотренные частью первой настоящей статьи, повлекшие причинение потерпевшему вреда здоровью, не имеющие признаков уголовно наказуемого деяния, или повреждение транспортных средств, грузов, дорожных и иных сооружений либо иного имущества, –","влекут административный арест на двадцать суток и лишение права управления транспортным средством сроком на семь лет.","3-1. Действия, предусмотренные частью первой настоящей статьи, совершенные повторно в течение года после истечения срока административного взыскания, –","влекут административный арест на двадцать суток и лишение права управления транспортным средством сроком на восемь лет.","3-2. Действия, предусмотренные частью третьей настоящей статьи, совершенные повторно в течение года после истечения срока административного взыскания, –","влекут административный арест на двадцать пять суток и лишение права управления транспортным средством сроком на девять лет.","4. Исключен Законом РК от 27.12.2019 № 292-VІ (порядок введения в действие см. ст. 2).","5. Исключен Законом РК от 27.12.2019 № 292-VІ (порядок введения в действие см. ст. 2).","6. Действия, предусмотренные частями первой и третьей настоящей статьи, совершенные лицами, не имеющими права управления транспортными средствами, –","влекут административный арест на двадцать суток.","7. Действия, предусмотренные частью шестой настоящей статьи, совершенные повторно в течение года после истечения срока административного взыскания, предусмотренного частью шестой настоящей статьи, –","влекут административный арест на тридцать суток.","8. Действия, предусмотренные частями шестой и седьмой настоящей статьи, совершенные лицами, к которым административный арест в соответствии с частью второй статьи 50 настоящего Кодекса не применяется, –","влекут штраф в размере двухсот месячных расчетных показателей."]},"609":{"title":"Статья 609. Осуществление регулярных автомобильных перевозок пассажиров и багажа без соответствующего свидетельства, подтверждающего право обслуживания маршрутов указанных перевозок","t":[]},"610":{"title":"Статья 610. Нарушение водителями транспортных средств правил дорожного движения, повлекшее причинение вреда здоровью людей, повреждение транспортных средств или иного имущества","t":["1. Нарушение водителями транспортных средств правил дорожного движения, повлекшее повреждение транспортных средств, грузов, дорог, дорожных и других сооружений или иного имущества, причинившее материальный ущерб, –","влечет штраф в размере двадцати месячных расчетных показателей.","2. Действие, предусмотренное частью первой настоящей статьи, совершенное повторно в течение года после наложения административного взыскания, либо повлекшее причинение легкого вреда здоровью потерпевшего, –","влечет штраф в размере сорока месячных расчетных показателей или лишение права управления транспортным средством на срок до девяти месяцев.","3. Действия, предусмотренные частями первой и второй настоящей статьи, совершенные лицом, не имеющим либо лишенным права управления транспортным средством, –","влекут штраф в размере шестидесяти месячных расчетных показателей."]},"611":{"title":"Статья 611. Невыполнение водителем обязанностей в связи с дорожно-транспортным происшествием","t":["1. Невыполнение водителем обязанностей, предусмотренных законодательством Республики Казахстан в сфере дорожного движения, в связи с дорожно-транспортным происшествием, участником которого он является, за исключением случаев, предусмотренных частью второй настоящей статьи, –","влечет штраф в размере пяти месячных расчетных показателей.","2. Оставление водителем в нарушение правил дорожного движения места дорожно-транспортного происшествия, участником которого он являлся, –","влечет штраф в размере пятидесяти месячных расчетных показателей либо лишение права управления транспортными средствами на срок один год.","3. Действие, предусмотренное частью второй настоящей статьи, совершенное лицом, лишенным права управления транспортным средством либо не имеющим права управления транспортными средствами, –","влечет штраф в размере ста месячных расчетных показателей либо административный арест на тридцать суток.","Примечание. Лицо, оставившее место дорожно-транспортного происшествия в связи с оказанием медицинской помощи пострадавшему, освобождается от ответственности по настоящей статье."]},"612":{"title":"Статья 612. Управление транспортным средством лицом без документов и не имеющим права управления","t":["1. Управление транспортным средством водителем, не имеющим при себе водительского удостоверения или временного удостоверения, выданного взамен водительского удостоверения на право управления, за исключением выданных в Республике Казахстан в случае наличия при себе документа, удостоверяющего личность водителя; регистрационных документов на транспортное средство, за исключением выданных в Республике Казахстан; иных установленных законодательством документов на транспортное средство, –","влечет предупреждение либо штраф в размере пяти месячных расчетных показателей.","2. Управление транспортным средством лицом, не имеющим права управления им (кроме учебной езды), а равно управление транспортным средством водителем, не имеющим права управления соответствующей категорией транспорта, –","влекут штраф в размере двадцати месячных расчетных показателей.","3. Управление транспортным средством водителем, лишенным права управления транспортным средством, –","влечет штраф в размере пятидесяти месячных расчетных показателей либо административный арест на десять суток.","4. Действия, предусмотренные частью второй настоящей статьи, совершенные повторно в течение года после наложения административного взыскания, –","влекут штраф в размере тридцати месячных расчетных показателей.","4-1. Действия, предусмотренные частью третьей настоящей статьи, совершенные повторно в течение года после наложения административного взыскания, –","влекут штраф в размере семидесяти месячных расчетных показателей либо административный арест на пятнадцать суток.","5. Передача управления транспортным средством лицу, не имеющему права управления (за исключением случаев обучения вождению в соответствии с установленными правилами), либо лицу, лишенному права управления транспортным средством, –","влечет штраф в размере пятидесяти месячных расчетных показателей.","6. Действие, предусмотренное частью пятой настоящей статьи, совершенное повторно в течение года после наложения административного взыскания, –","влечет штраф в размере семидесяти месячных расчетных показателей."]},"613":{"title":"Статья 613. Невыполнение требований сотрудника органов внутренних дел (полиции), транспортного контроля на пунктах пропуска автотранспортных средств через Государственную границу Республики Казахстан и на постах транспортного контроля на территории Республики Казахстан, военной полиции, уклонение от прохождения освидетельствования на состояние алкогольного, наркотического и (или) токсикоманического опьянения","t":["1. Невыполнение законного требования сотрудника органов внутренних дел (полиции), военной полиции (исключительно лицом, управляющим транспортным средством органов национальной безопасности, Вооруженных Сил Республики Казахстан, других войск и воинских формирований Республики Казахстан), органов транспортного контроля на постах транспортного контроля на территории Республики Казахстан об остановке транспортного средства –","влечет штраф в размере сорока месячных расчетных показателей либо административный арест на срок до трех суток.","2. Исключен Законом РК от 30.12.2019 № 300-VІ (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования).","3. Действие, предусмотренное частью первой настоящей статьи, совершенное повторно в течение года после наложения административного взыскания, –","влечет лишение права на управление транспортными средствами сроком на один год и административный арест на срок до пяти суток.","3-1. Действие, предусмотренное частью первой настоящей статьи, совершенное лицом, не имеющим права управления либо лишенным права управления транспортными средствами, –","влечет штраф в размере шестидесяти месячных расчетных показателей либо административный арест на срок до пятнадцати суток.","4. Невыполнение законного требования сотрудника органов внутренних дел (полиции), военной полиции (исключительно лицом, управляющим транспортным средством органов национальной безопасности, Вооруженных Сил Республики Казахстан, других войск и воинских формирований Республики Казахстан) о прохождении в соответствии с установленным порядком освидетельствования на состояние алкогольного, наркотического и (или) токсикоманического опьянения –","влечет административный арест на пятнадцать суток и лишение права управления транспортным средством сроком на восемь лет.","5. Действие, предусмотренное частью четвертой настоящей статьи, совершенное повторно в течение года после истечения срока административного взыскания, –","влечет административный арест на двадцать суток и лишение права управления транспортным средством сроком на девять лет.","6. Исключен Законом РК от 27.12.2019 № 292-VІ (порядок введения в действие см. ст. 2).","7. Исключен Законом РК от 27.12.2019 № 292-VІ (порядок введения в действие см. ст. 2).","8. Исключен Законом РК от 27.12.2019 № 292-VІ (порядок введения в действие см. ст. 2).","9. Действие, предусмотренное частью четвертой настоящей статьи, совершенное лицами, не имеющими права управления транспортными средствами, –","влечет административный арест на двадцать пять суток.","10. Действие, предусмотренное частью девятой настоящей статьи, совершенное повторно в течение года после истечения срока административного взыскания, предусмотренного частью девятой настоящей статьи, –","влечет административный арест на тридцать суток.","11. Действия, предусмотренные частями девятой и десятой настоящей статьи, совершенные лицами, к которым административный арест в соответствии с частью второй статьи 50 настоящего Кодекса не применяется, –","влекут штраф в размере двухсот месячных расчетных показателей.","12. Оставление водителем кабины (салона) транспортного средства в случае его остановки сотрудником органов внутренних дел (полиции), военной полиции (исключительно лицом, управляющим военным транспортным средством) без его разрешения, а также невыполнение требований о выходе из кабины (салона) транспортного средства –","влекут штраф на водителя в размере пяти месячных расчетных показателей.","13. Действия, предусмотренные частью двенадцатой настоящей статьи, совершенные повторно в течение года после наложения административного взыскания, –","влекут штраф на водителя в размере десяти месячных расчетных показателей.","Примечание. Требование сотрудников органов внутренних дел (полиции), транспортного контроля, военной полиции в форменной одежде об остановке транспортного средства выражается путем подачи сигнала жестом руки или жезлом с одновременным сигналом свистка либо с помощью громкоговорящего устройства. Сигналы должны быть понятны водителю и поданы своевременно с тем, чтобы их исполнение не создало аварийную обстановку."]},"614":{"title":"Статья 614. Создание препятствий для движения транспортных средств","t":["Умышленное создание препятствий для движения транспортных средств –","влекут штраф на физических лиц в размере трех, на должностных лиц – в размере десяти месячных расчетных показателей."]},"615":{"title":"Статья 615. Нарушение правил движения пешеходами и иными участниками дорожного движения","t":["1. Невыполнение пешеходами и иными участниками дорожного движения требований правил дорожного движения –","влечет штраф в размере двух месячных расчетных показателей.","2. Действие, предусмотренное частью первой настоящей статьи, повлекшее причинение потерпевшему вреда здоровью, не имеющее признаков уголовно наказуемого деяния либо причинившее материальный ущерб, –","влечет штраф в размере десяти месячных расчетных показателей.","3. Действие, предусмотренное частью первой настоящей статьи, совершенное повторно в течение года после наложения административного взыскания, –","влечет штраф в размере десяти месячных расчетных показателей.","4. Действие, предусмотренное частью второй настоящей статьи, совершенное повторно в течение года после наложения административного взыскания, –","влечет штраф в размере двадцати месячных расчетных показателей или привлечение к общественным работам на срок двенадцать часов, или административный арест на трое суток.","5. Нахождение пассажира вне кабины (салона) транспортного средства при его движении –","влечет штраф в размере десяти месячных расчетных показателей.","Примечание. Под иными участниками дорожного движения в настоящей статье следует понимать лиц, управляющих электрическими самокатами, велосипедами и гужевыми повозками, погонщиков, ведущих по дороге вьючных, верховых животных или стадо, а также пассажиров транспортных средств."]}}};

  const RX = {

  const at = (rx, s, i) => { rx.lastIndex = i; const m = rx.exec(s); return m; };
  const btn = (label, attrs) => `<button type="button" class="rf"${Object.entries(attrs).map(([k, v]) => ` data-r${k}="${esc(v)}"`).join('')}>${esc(label)}</button>`;
  const signNum = n => n.replace(/\s/g, '');

  function html(text, opt = {}) {
    const s = String(text ?? '');

  // ---------- Sheet ----------
  let dlg = null;
  // Styles go in at load, so the links look like links before the first sheet opens.
  const st = document.createElement('style');

<script>
// Shared scene library for the PDD RK trainers (rings, U-turns and lane changes, parking).
// Exposes window.ENG: route builder, ring point helper and layout builders used by page data.
(() => {
  const CX = 200, CY = 200;

  // Route commands -> SVG polyline path. Commands:
  //   ['M', x, y]            start
  //   ['L', x, y]            straight line
  //   ['Q', cx, cy, x, y]    quadratic curve
  //   ['A', r, deg, k]       counter-clockwise (on screen) arc around the ring centre to angle deg,
  //                          radius moves to r within the first 1/k of the arc (k defaults to 1)
  function route(cmds, cx = CX, cy = CY) {
    const pts = [];
    let x = 0, y = 0;
    const push = (px, py) => { pts.push([px, py]); x = px; y = py; };
    for (const c of cmds) {
      const op = c[0];
      if (op === 'M') push(c[1], c[2]);
      else if (op === 'L') {
        const x0 = x, y0 = y, n = Math.max(1, Math.ceil(Math.hypot(c[1] - x0, c[2] - y0) / 4));
        for (let i = 1; i <= n; i++) push(x0 + (c[1] - x0) * i / n, y0 + (c[2] - y0) * i / n);
      } else if (op === 'Q') {
        const x0 = x, y0 = y, n = 28;
        for (let i = 1; i <= n; i++) { const t = i / n, u = 1 - t; push(u * u * x0 + 2 * u * t * c[1] + t * t * c[3], u * u * y0 + 2 * u * t * c[2] + t * t * c[4]); }
      } else if (op === 'A') {
        const r0 = Math.hypot(x - cx, y - cy), phi0 = Math.atan2(y - cy, x - cx) * 180 / Math.PI;
        let pe = c[2];

  // ---------- Layouts ----------
  // Straight street: road from y=Y0, lanes of LW px. Two-way 2 lanes: top lane goes left (west), bottom lane goes right (east).
  const Y0 = 100, LW = 36;
  const laneY = i => Y0 + LW * (i + 0.5);
  function street(o = {}) {
    const W = o.w || 400, n = o.lanes || 2, H = o.h || 260, y1 = Y0 + n * LW, th = o.th || 26, bh = o.bh || 26;
    let g = `<rect class="gr" x="0" y="0" width="${W}" height="${H}"/>`;
    const side = (kind, y, h) => kind === 'walk' ? `<rect class="walk" x="0" y="${y}" width="${W}" height="${h}"/>` : kind === 'shoulder' ? `<rect class="sh" x="0" y="${y}" width="${W}" height="${h}"/>` : '';

    if ((o.bottom || 'walk') === 'walk') g += `<line class="curb" x1="0" y1="${y1}" x2="${W}" y2="${y1}"/>`;

      if (kind === 'dash') return `<line class="dl" x1="${x1}" y1="${y}" x2="${x2}" y2="${y}"/>`;
      if (kind === 'solid') return `<line class="ln" x1="${x1}" y1="${y}" x2="${x2}" y2="${y}"/>`;
      if (kind === 'double') return `<line class="ln" x1="${x1}" y1="${y - 3}" x2="${x2}" y2="${y - 3}"/><line class="ln" x1="${x1}" y1="${y + 3}" x2="${x2}" y2="${y + 3}"/>`;
      if (kind === '1.11') return `<line class="ln" x1="${x1}" y1="${y - 3}" x2="${x2}" y2="${y - 3}"/><line class="dl" x1="${x1}" y1="${y + 3}" x2="${x2}" y2="${y + 3}"/>`;
      if (kind === '1.8') return `<line class="w18" x1="${x1}" y1="${y}" x2="${x2}" y2="${y}"/>`;
      if (kind === '1.11r') return `<line class="dl" x1="${x1}" y1="${y - 3}" x2="${x2}" y2="${y - 3}"/><line class="ln" x1="${x1}" y1="${y + 3}" x2="${x2}" y2="${y + 3}"/>`;

    return g;
  }

  // Ring: centre (200,200), island radius RI, outer radius RO, four arms of width AW, arm length to H.
  function ring(o = {}) {
    const RO = o.ro || 132, RI = o.ri || 64, AW = o.aw || 72, lanes = o.lanes || 2, H = o.h || 400;
    let g = `<rect class="gr" x="0" y="0" width="400" height="${H}"/>`;
    g += `<rect class="rd" x="${200 - AW / 2}" y="0" width="${AW}" height="${H}"/><rect class="rd" x="0" y="${200 - AW / 2}" width="400" height="${AW}"/>`;
    g += `<circle class="rd" cx="200" cy="200" r="${RO}"/>`;
