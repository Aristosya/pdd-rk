    const tops = (s.feat || []).filter(f => f.top).map(one).join('');
    const signs = (s.signs || []).map(sign).join('');
    return `<svg class="sc" viewBox="${vb}" role="img" aria-label="${esc(s.t)}">${bg}${feats}<g class="l-res"></g><g class="l-arrows"></g>${signs}<g class="l-veh"></g><g class="l-top">${tops}</g><g class="l-bdg"></g><g class="l-paths"></g></svg>`;
  }
  function cardHTML(s) {
    const g = P.groups.find(x => x.k === s.g);
    const q = s.q || { type: 'show' };
    let ask = '';
    if (q.type === 'yn' || q.type === 'pick') ask = `<div class="opts${q.type === 'pick' ? ' col' : ''}">${(q.opts || ['Можно', 'Нельзя']).map((o, i) => `<button type="button" class="btn opt" data-o="${i}">${esc(o)}</button>`).join('')}</div>`;
    if (q.type === 'order') ask = `<div class="who">${s.cars.filter(c => c.label && !c.dim).map(c => `<button type="button" data-p="${esc(c.label)}" aria-pressed="false"><i style="border-color:${c.col || COL[c.label] || '#2F80ED'}">${esc(c.label)}</i>${esc(c.what || '')}<b></b></button>`).join('')}</div><p class="hint">Ваш порядок: <span class="seq">нажмите участников по очереди</span></p><div class="act"><button type="button" class="btn primary" data-a="check" disabled>Проверить</button><button type="button" class="btn" data-a="reset">Сначала</button></div>`;
    if (q.type === 'show') ask = `<div class="act"><button type="button" class="btn primary" data-a="show">Показать</button></div>`;
    const answerLine = q.type === 'order' ? orderText(q) : q.type === 'show' ? '' : `Правильно: ${esc((q.opts || ['Можно', 'Нельзя'])[q.ans])}`;
    return `<article class="card${q.type === 'show' ? ' shown' : ''}${q.type === 'yn' || q.type === 'pick' ? ' q-choice' : ''}" id="card-${s.id}" data-id="${s.id}">
      <div class="card-h"><h3>${esc(s.t)}</h3><span class="tag">${esc(g ? g.t : '')}<span class="tick" hidden>✓</span></span></div>
      ${s.signTop ? `<div class="signtop">${s.signTop.map(e => { const ks = Array.isArray(e) ? e : [e]; return `<figure class="stk">${ks.map((k, i) => IMG[k] ? `<img class="${i ? 'pl' : 'sg'}" src="${IMG[k]}" alt="${i ? 'Табличка' : 'Знак'} ${esc(k)}">` : '').join('')}<figcaption>${esc(ks.join(' + '))}</figcaption></figure>`; }).join('')}</div>` : ''}
      ${s.scene === false ? '' : s.pic ? `<div class="stage pic">${typeof s.pic === 'function' ? s.pic() : s.pic}</div>` : `<div class="stage">${sceneSVG(s)}</div>`}
      ${s.setup ? `<p class="setup">${H(s.setup)}</p>` : ''}
      ${q.text ? `<p class="qtext">${H(q.text)}</p>` : ''}
      ${ask}
      <div class="result"${q.type === 'show' ? '' : ' hidden'}>${q.type === 'show' ? '' : '<p class="verdict"></p>'}${answerLine ? `<p class="answer">${answerLine}</p>` : ''}${s.why ? `<p class="why">${H(s.why)}</p>` : ''}${s.ref ? `<p class="ref">${H(s.ref)}</p>` : ''}${q.type === 'show' || s.scene === false || s.pic ? '' : '<div><button type="button" class="link-btn" data-a="replay">Показать ещё раз</button></div>'}</div>
    </article>`;
  }
  function orderText(q) {
    const join = a => a.length === 1 ? a[0] : a.slice(0, -1).join(', ') + ' и ' + a[a.length - 1];
    let h = q.order.map((grp, i) => `<span class="n">${i + 1}</span>${esc(join(grp))}${grp.length > 1 ? ' одновременно' : ''}`).join(' → ');
    if (q.stay && q.stay.length) h += `<br>Стоят: ${esc(join(q.stay))}`;
    return h;
  }

  function el(n, a) { const e = document.createElementNS(NS, n); for (const k in a) e.setAttribute(k, a[k]); return e; }
  function setupCard(s) {
    const card = $('card-' + s.id), svg = card.querySelector('svg.sc');
    if (!svg) { // text or picture card: answers only, nothing to animate
      const st = { s, card, svg: null, items: {}, seq: [], token: 0 };
      card.addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; if (b.dataset.o != null) answerOpt(st, +b.dataset.o); if (b.dataset.a === 'reset') resetCard(st); });
      ST[s.id] = st;
      return;
    }
    const L = { res: svg.querySelector('.l-res'), arrows: svg.querySelector('.l-arrows'), veh: svg.querySelector('.l-veh'), bdg: svg.querySelector('.l-bdg'), paths: svg.querySelector('.l-paths') };
    const vb = (s.vb || '0 0 400 260').split(' ').map(Number);
    const st = { s, card, svg, L, items: {}, seq: [], token: 0, W: vb[2], H: vb[3] };
    const q = s.q || { type: 'show' };
    const stay = new Set(q.stay || []);
    (s.cars || []).forEach((c, idx) => {
      const id = c.label || ('x' + idx), kind = c.kind || 'car', col = c.col || COL[c.label] || (c.dim ? COL._ : '#2F80ED');
      const it = { c, id, kind, col };
      if (c.path) {
        const d = pathOf(c.path);
        it.pe = el('path', { d, fill: 'none', stroke: 'none' }); L.paths.appendChild(it.pe);
        it.len = it.pe.getTotalLength(); it.d1 = c.d1 != null ? c.d1 : it.len;
        { // start no earlier than the point where the vehicle first fits inside the scene
          const m = (HALF[kind] || 18) + 2;
          let d = 0;
          for (; d < it.len; d += 4) { const p = it.pe.getPointAtLength(d); if (p.x >= m && p.x <= st.W - m && p.y >= m && p.y <= st.H - m) break; }
          it.d0 = Math.min(Math.max(c.d0 ?? 0, d < it.len ? d : 0), it.d1);
        }
        if (c.arrow !== false && !c.ghost && !c.dim) {
          const pts = []; const a0 = it.d0 + (HALF[kind] || 18) + 4, a1 = Math.min(it.d1, it.d0 + (c.arrowLen || 9999));
          for (let x = a0; x <= a1; x += 4) pts.push(it.pe.getPointAtLength(x));
          if (pts.length > 1) {
            const a = pts[pts.length - 1], b = pts[pts.length - 2], ang = Math.atan2(a.y - b.y, a.x - b.x);
            L.arrows.appendChild(el('polyline', { points: pts.map(p => `${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' '), class: 'arrow' + (kind === 'ped' ? ' dash' : ''), stroke: col }));
            L.arrows.appendChild(el('polygon', { points: [[a.x + Math.cos(ang) * 6, a.y + Math.sin(ang) * 6], [a.x + Math.cos(ang + 2.4) * 9, a.y + Math.sin(ang + 2.4) * 9], [a.x + Math.cos(ang - 2.4) * 9, a.y + Math.sin(ang - 2.4) * 9]].map(p => p.map(v => v.toFixed(1)).join(',')).join(' '), fill: col, opacity: .9 }));
          }
        }
      }
      it.veh = el('g', { class: 'veh' + (c.ghost ? ' ghost' : ''), 'data-p': id }); it.veh.innerHTML = drawVeh(kind, col); L.veh.appendChild(it.veh);
      it.bdg = el('g', { class: 'bdg' + (c.ghost ? ' ghost' : ''), 'data-p': id });
      if (c.label && !c.dim) {
        const tc = kind === 'amb' ? '#B8C2C9' : col;
        it.bdg.innerHTML = `<circle r="9" fill="#fff" stroke="${tc}" stroke-width="3"/><text y="4" text-anchor="middle" font-family="Golos Text, Arial" font-weight="700" font-size="${c.label.length > 1 ? 8 : 11}" fill="#14202A">${esc(c.label)}</text>`
          + `<g class="ans" transform="translate(14 -14)"><circle r="10" fill="#FFC72C" stroke="#14202A" stroke-width="1.5"/><text class="ans-t" y="4.5" text-anchor="middle" font-family="Fira Sans Extra Condensed, Arial" font-weight="700" font-size="13" fill="#14202A"></text></g>`
          + `<g class="pk" transform="translate(-14 -14)"><circle r="9.5" fill="#0A87A8" stroke="#fff" stroke-width="1.5"/><text class="pk-t" y="4.5" text-anchor="middle" font-family="Fira Sans Extra Condensed, Arial" font-weight="700" font-size="12" fill="#fff"></text></g>`
          + (stay.has(c.label) ? `<g class="xs" transform="translate(14 -14)"><circle r="10" fill="#C62A2F" stroke="#fff" stroke-width="1.5"/><path d="M-4 -4L4 4M4 -4L-4 4" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/></g>` : '');
        if (q.type === 'order') {
          const gi = q.order.findIndex(g => g.includes(c.label));
          if (gi >= 0) it.bdg.querySelector('.ans-t').textContent = gi + 1; else it.bdg.querySelector('.ans').remove();
        } else { const a = it.bdg.querySelector('.ans'); if (a) a.remove(); }
      }
      L.bdg.appendChild(it.bdg);
      st.items[id] = it;
      home(it);
    });
    // Result overlays: green = correct manoeuvre, red dashed with a cross = forbidden one.
    (s.res || []).forEach(r => {
      const d = pathOf(r.p);
      const pe = el('path', { d, class: 'resp ' + (r.ok ? 'okp' : 'nop') });
      L.res.appendChild(pe);
      if (!r.ok) {
        const len = pe.getTotalLength(), m = pe.getPointAtLength(len * (r.at ?? 0.55));
        L.res.appendChild(el('path', { d: `M${m.x - 7} ${m.y - 7}L${m.x + 7} ${m.y + 7}M${m.x + 7} ${m.y - 7}L${m.x - 7} ${m.y + 7}`, class: 'resx' }));
      } else {
        const len = pe.getTotalLength(), a = pe.getPointAtLength(len), b = pe.getPointAtLength(Math.max(0, len - 3)), ang = Math.atan2(a.y - b.y, a.x - b.x);
        L.res.appendChild(el('polygon', { class: 'resh', points: [[a.x + Math.cos(ang) * 6, a.y + Math.sin(ang) * 6], [a.x + Math.cos(ang + 2.4) * 9, a.y + Math.sin(ang + 2.4) * 9], [a.x + Math.cos(ang - 2.4) * 9, a.y + Math.sin(ang - 2.4) * 9]].map(p => p.map(v => v.toFixed(1)).join(',')).join(' ') }));
      }
    });
    card.querySelector('svg').addEventListener('click', e => { const t = e.target.closest('[data-p]'); if (t && q.type === 'order') pick(st, t.getAttribute('data-p')); });
    card.addEventListener('click', e => {
      const b = e.target.closest('button'); if (!b) return;
      if (b.dataset.p) pick(st, b.dataset.p);
      if (b.dataset.o != null) answerOpt(st, +b.dataset.o);
      const a = b.dataset.a;
      if (a === 'check') checkOrder(st);
      if (a === 'reset') resetCard(st);
      if (a === 'replay' || a === 'show') play(st);
    });
    ST[s.id] = st;
  }

  function place(it, d) {
    if (!it.pe) { const [x, y, deg] = it.c.at || [0, 0, 0]; it.veh.setAttribute('transform', `translate(${x} ${y}) rotate(${deg})`); it.bdg.setAttribute('transform', `translate(${x} ${y})`); return; }
    const len = it.len, dd = Math.max(0, Math.min(len, d));
    // Heading from a forward difference, or a backward one at the path end and just before a reversing point.
    const q = it.pe.getPointAtLength(dd);
    const back = dd + 2 > len || [it.c.rev, it.c.fwd].some(c => typeof c === 'number' && dd < c && dd + 2 > c);
    const q1 = back ? it.pe.getPointAtLength(Math.max(0, dd - 2)) : q, qq = back ? q : it.pe.getPointAtLength(dd + 2);
    let deg = Math.atan2(qq.y - q1.y, qq.x - q1.x) * 180 / Math.PI + 90;
    let rv = it.c.rev;                   // reversing: true for the whole path, or a distance from which the car backs up
    if (typeof rv === 'number') rv = dd >= rv && (it.c.fwd == null || dd < it.c.fwd);
    if (rv) deg += 180;
    if (it.kind === 'ped') deg = 0;
    it.veh.setAttribute('transform', `translate(${q.x.toFixed(1)} ${q.y.toFixed(1)}) rotate(${deg.toFixed(1)})`);
    it.bdg.setAttribute('transform', `translate(${q.x.toFixed(1)} ${q.y.toFixed(1)})`);
  }
  const home = it => { it.cur = it.d0 ?? 0; place(it, it.cur); it.veh.style.opacity = ''; it.bdg.style.opacity = ''; };

  function markCard(id) { const c = $('card-' + id); const ok = progress[id] === 'ok'; c.classList.toggle('ok', ok); c.querySelector('.tick').hidden = !ok; }
  function answerOpt(st, i) {
    if (st.card.classList.contains('answered')) return;
    const q = st.s.q, ok = i === q.ans;
    st.card.querySelectorAll('.opt').forEach((b, k) => { b.disabled = true; if (k === q.ans) b.classList.add('right'); else if (k === i) b.classList.add('wrong'); });
    progress[st.s.id] = ok ? 'ok' : 'bad'; saveProgress(); updateProgress();
    reveal(st, ok ? 'Верно!' : 'Не так.', ok);
  }
  function reveal(st, msg, ok) {
    const { card } = st;
    card.classList.add('answered', ok ? 'r-ok' : 'r-bad');
    const v = card.querySelector('.verdict'); if (v) v.textContent = msg;
    card.querySelector('.result').hidden = false;
    markCard(st.s.id);
    play(st);
  }
  function updatePicks(st) {
    const { card, seq } = st;
    Object.values(st.items).forEach(it => { const pk = it.bdg.querySelector('.pk'); if (!pk) return; const i = seq.indexOf(it.id); pk.classList.toggle('on', i >= 0); if (i >= 0) pk.querySelector('.pk-t').textContent = i + 1; });
    card.querySelectorAll('.who button').forEach(b => { const i = seq.indexOf(b.dataset.p); b.setAttribute('aria-pressed', String(i >= 0)); b.querySelector('b').textContent = i >= 0 ? i + 1 : ''; });
    const s = card.querySelector('.seq'); if (s) s.textContent = seq.length ? seq.map((id, i) => `${i + 1}. ${id}`).join('  →  ') : 'нажмите участников по очереди';
    const c = card.querySelector('[data-a="check"]'); if (c) c.disabled = seq.length === 0 || card.classList.contains('answered');
  }
  function pick(st, id) {
    if (st.card.classList.contains('answered') || st.running) return;
    if (st.seq.includes(id)) st.seq = st.seq.filter(x => x !== id); else st.seq.push(id);
    updatePicks(st);
    const movers = st.s.q.order.flat();
    if (st.seq.length === movers.length && st.seq.every(x => movers.includes(x))) checkOrder(st);
  }
  function checkOrder(st) {
    const q = st.s.q, seq = st.seq; if (!seq.length) return;
    let ok = true, msg = 'Верно!';
    const bad = seq.find(x => (q.stay || []).includes(x));
    const movers = q.order.flat(), gi = id => q.order.findIndex(g => g.includes(id));
    if (bad) { ok = false; msg = `Не так: ${bad} сейчас ехать нельзя.`; }
    else if (seq.length !== movers.length || !movers.every(x => seq.includes(x))) { ok = false; msg = 'Не так: в ответе не все, кто едет.'; }
    else for (let i = 1; i < seq.length; i++) if (gi(seq[i]) < gi(seq[i - 1])) { ok = false; msg = 'Не так: очередь другая.'; break; }
    progress[st.s.id] = ok ? 'ok' : 'bad'; saveProgress(); updateProgress();
    reveal(st, msg, ok);
  }
  function resetCard(st) {
    st.token++; st.running = false; st.seq = [];
    st.card.classList.remove('answered', 'r-ok', 'r-bad', 'done');
    st.card.querySelector('.result').hidden = true;
    st.card.querySelectorAll('.opt').forEach(b => { b.disabled = false; b.classList.remove('right', 'wrong'); });
    Object.values(st.items).forEach(it => { home(it); const a = it.bdg.querySelector('.ans'); if (a) a.classList.remove('on'); });
    updatePicks(st);
  }

  const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  function play(st) {
    const tok = ++st.token, s = st.s, q = s.q || { type: 'show' };
    const items = Object.values(st.items);
    items.forEach(home);
    if (!st.svg) { st.card.classList.add('done'); return; }
    const clock = st.svg.querySelector('[data-clock]');
    const clock0 = (s.feat || []).find(f => f.t === 'clock');
    if (clock && clock0) clock.textContent = clock0.text || '';
    let steps = s.demo || (q.order ? q.order.map(ids => ({ ids })) : [{ ids: Object.keys(st.items).filter(k => st.items[k].pe && !st.items[k].c.ghost && !st.items[k].c.dim) }]);
    steps = steps.map(x => Array.isArray(x) ? { ids: x } : x);
    st.card.classList.remove('done');
    if (reduce) { steps.forEach(stp => (stp.ids || []).forEach(id => { const it = st.items[id]; if (it && it.pe) { it.cur = stp.to ?? it.d1; place(it, it.cur); } })); st.card.classList.add('done'); if (clock && steps.length) { const last = [...steps].reverse().find(x => x.clock); if (last) clock.textContent = last.clock; } return; }
    st.running = true;
    let gi = 0;
    const DUR = s.dur || 1700;
    const next = () => {
      if (tok !== st.token) return;
      if (gi >= steps.length) { st.running = false; st.card.classList.add('done'); return; }
      const stp = steps[gi];
      if (clock && stp.clock) clock.textContent = stp.clock;
      const grp = (stp.ids || []).map(id => st.items[id]).filter(it => it && it.pe);
      grp.forEach(it => { it.from = it.cur; it.goal = stp.to ?? it.d1; });
      grp.forEach(it => { const a = it.bdg.querySelector('.ans'); if (a) a.classList.add('on'); });
      const t0 = performance.now(), dur = grp.length ? (stp.dur || DUR) : (stp.dur || 600);
      const frame = now => {
        if (tok !== st.token) return;
        const t = Math.min(1, (now - t0) / dur), e = ease(t);
        grp.forEach(it => {
          it.cur = it.from + e * (it.goal - it.from); place(it, it.cur);
          const end = it.pe.getPointAtLength(it.goal), out = it.goal >= it.len - 1 && (end.x < -10 || end.x > st.W + 10 || end.y < -10 || end.y > st.H + 10);
          if (out && t > .85) { const o = String(Math.max(0, 1 - (t - .85) / .15)); it.veh.style.opacity = o; it.bdg.style.opacity = o; }
        });
        if (t < 1) requestAnimationFrame(frame); else { gi++; setTimeout(next, stp.pause || 250); }
      };
      requestAnimationFrame(frame);
    };
    setTimeout(next, 250);
  }

  // ---------- Page ----------
  let filter = 'all', todoOnly = false;
  function updateProgress() {
    const qs = P.scenes.filter(s => s.q && s.q.type !== 'show');
    const n = qs.filter(s => progress[s.id] === 'ok').length;
    $('okc').textContent = n; $('okt').textContent = qs.length; $('okbar').style.width = (qs.length ? 100 * n / qs.length : 0).toFixed(1) + '%';
  }
  function renderChips() {
    const cnt = k => P.scenes.filter(s => s.g === k).length;
    $('chips').innerHTML = `<button type="button" class="chip" data-f="all" aria-pressed="true">Все <span class="n">${P.scenes.length}</span></button>` + P.groups.map(g => `<button type="button" class="chip" data-f="${g.k}" aria-pressed="false">${esc(g.t)} <span class="n">${cnt(g.k)}</span></button>`).join('') + `<button type="button" class="chip todo" data-f="todo" aria-pressed="false">Ещё не решены</button>`;
  }
  function applyFilter() {
    P.scenes.forEach(s => { $('card-' + s.id).hidden = !((filter === 'all' || s.g === filter) && (!todoOnly || progress[s.id] !== 'ok' || !s.q || s.q.type === 'show')); });
    P.groups.forEach(g => { $('sec-' + g.k).hidden = !P.scenes.some(s => s.g === g.k && !$('card-' + s.id).hidden); });
    $('chips').querySelectorAll('.chip').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.f === 'todo' ? todoOnly : b.dataset.f === filter)));
  }
  function build() {
    $('list').innerHTML = P.groups.map(g => {
      const items = P.scenes.filter(s => s.g === g.k);
      return `<section class="sec" id="sec-${g.k}"><h2>${esc(g.t)} <small>${items.length}</small></h2>${g.rules && g.rules.length ? `<ol class="rules">${g.rules.map(r => `<li>${H(r)}</li>`).join('')}</ol>` : ''}</section>` + items.map(cardHTML).join('');
    }).join('');
    P.scenes.forEach(setupCard);
    P.scenes.forEach(s => markCard(s.id));
    renderChips(); updateProgress(); applyFilter();
  }
  $('chips').addEventListener('click', e => { const b = e.target.closest('.chip'); if (!b) return; if (b.dataset.f === 'todo') todoOnly = !todoOnly; else filter = b.dataset.f; applyFilter(); });
  $('resetp').addEventListener('click', () => { progress = {}; saveProgress(); P.scenes.forEach(s => { markCard(s.id); resetCard(ST[s.id]); }); updateProgress(); applyFilter(); });
  window.addEventListener('beforeprint', () => P.scenes.forEach(s => { const st = ST[s.id]; st.token++; st.running = false; Object.values(st.items).forEach(home); }));
  build();
})();

</script>

</body>
