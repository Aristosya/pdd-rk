<script>
// Tappable references: «п. 84», «знак 3.27», «разметка 1.4», «ст. 597 КоАП» open the official text in a sheet.
// Needs window.REFDATA (tools/refs_data.json); sign pictures come from window.REFS_IMG(num) when the page has them.
(() => {
  const D = window.REFDATA;
  if (!D) return;
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const SRC = { pdd: 'https://adilet.zan.kz/rus/docs/V2300033003', k: 'https://adilet.zan.kz/rus/docs/K1400000235', mz: 'https://adilet.zan.kz/rus/docs/V2000021814', apt: 'https://adilet.zan.kz/rus/docs/V1400009649' };
  const isWord = ch => !!ch && /[0-9A-Za-zА-Яа-яЁё]/.test(ch);

  // ---------- Parsing ----------
  const RX = {
    doc: /(Перечень|ОП(?=\s*,)|Основные положения(?=\s*,)|Прил\.\s*([12])|Стандарт(?= первой помощи)|Правила(?= первой помощи))/y,
    apt: /приказ МЗ РК № 368/y,
    tag: /⟦([\w:.-]+)\|([^⟧]+)⟧/y,
    pt: /(?:п\.|[Пп]ункт[а-яё]*)\s*(?=\d)/y,
    ptNum: /(\d+(?:-\d+)?)/y,
    subStart: /(,\s*|\s*\(\s*|\s+)пп\.\s*/y,
    subNum: /(\d+(?:-\d+)?)(?:\s*–\s*(\d+))?/y,
    subSep: /\s*(?:,|и)\s*(?=\d)/y,
    ptMore: /(\s*(?:,|и)\s*)(?=\d+(?:-\d+)?(?![\d.,]*\d)(?!\s*(?:м|км|т|см|мм|%|ч|мин|лет|год)))/y,
    gl: /гл\.\s*(\d+)/y,
    sign: /(?:[Зз]нак[а-яё]*|[Тт]абличк[а-яё]*)\s+(?=\d\.\d)/y,
    mark: /(?:[Рр]азметк[а-яё]*|[Лл]ини[а-яё]*|[Сс]трел[а-яё]*|[Сс]плошн[а-яё]*|[Пп]рерывист[а-яё]*)\s+(?=\d\.\d)/y,
    num: /(\d\.\d+(?:\.\d+)?(?:\s?[абвгд](?![а-яё]))?)/y,
    numSep: /(\s*(?:,|и|или|–|-)\s*)(?=\d\.\d)/y,
    koap: /ст\.\s*(\d{3})((?:\s*ч\.\s*\d+(?:-\d+)?(?:\s*(?:[–-]|,|и)\s*\d+(?:-\d+)?)*)?)(\s*КоАП(?:\s*РК)?)/y,
    bare: /([1-7]\.\d+(?:\.\d+)?(?:[абвгд](?![а-яё]))?)(?![\d])(?!\s*(?:м|км|т|см|мм|%|ч|мин|кг)(?![а-яё]))/y
  };
  // Documents cited by their full name, e.g. «Закон «О дорожном движении», ст. 29»
  const NAMED = Object.entries(D.gl).filter(([, g]) => g.match).map(([key, g]) => [key, g.match]);
  const at = (rx, s, i) => { rx.lastIndex = i; const m = rx.exec(s); return m; };
  const btn = (label, attrs) => `<button type="button" class="rf"${Object.entries(attrs).map(([k, v]) => ` data-r${k}="${esc(v)}"`).join('')}>${esc(label)}</button>`;
  const signNum = n => n.replace(/\s/g, '');

  function html(text, opt = {}) {
    const s = String(text ?? '');
    let out = '', i = 0, plain = 0, doc = opt.doc || 'pdd';
    const flush = j => { if (j > plain) out += esc(s.slice(plain, j)); };
    while (i < s.length) {
      const prev = s[i - 1];
      if (s[i] === ';') doc = opt.doc || 'pdd';
      let m;
      if (!isWord(prev) && (m = at(RX.doc, s, i))) {
        doc = m[1] === 'Перечень' ? 'pn' : m[1] === 'ОП' || m[1] === 'Основные положения' ? 'op' : m[1] === 'Стандарт' ? 'mzs' : m[1] === 'Правила' ? 'mzr' : 'pr' + m[2];
        i = RX.doc.lastIndex; continue;
      }
      if (s[i] === '⟦' && (m = at(RX.tag, s, i))) {
        flush(i); out += D.gl[m[1]] ? btn(m[2], { k: 'g', n: m[1] }) : esc(m[2]); i = plain = RX.tag.lastIndex; continue;
      }
      const named = !isWord(prev) && NAMED.find(([, t]) => s.startsWith(t, i));
      if (named) {
        flush(i); out += btn(named[1], { k: 'g', n: named[0] }); i = plain = i + named[1].length; continue;
      }
      if (!isWord(prev) && (m = at(RX.apt, s, i)) && D.gl.apt) {
        flush(i); out += btn(m[0], { k: 'g', n: 'apt' }); i = plain = RX.apt.lastIndex; continue;
      }
      if (!isWord(prev) && (m = at(RX.koap, s, i)) && D.k[m[1]]) {
        flush(i); out += btn(m[0], { k: 'k', n: m[1] }); i = plain = RX.koap.lastIndex; continue;
      }
      if (!isWord(prev) && (m = at(RX.pt, s, i))) {
        const d = ['op', 'pn', 'mzs', 'mzr'].includes(doc) ? doc : 'pdd';
        let j = RX.pt.lastIndex, first = true;
        flush(i);
        for (;;) {
          const pn = at(RX.ptNum, s, j); if (!pn) break;
          let k = RX.ptNum.lastIndex; const subs = [];
          const ss = at(RX.subStart, s, k);
          if (ss) {
            let q = RX.subStart.lastIndex;
            for (;;) {
              const sn = at(RX.subNum, s, q); if (!sn) break;
              q = RX.subNum.lastIndex;
              const own = (D[d === 'pdd' ? 'p' : d][pn[1]] || { s: {} }).s;
              let [a, z] = [sn[1], sn[2]];
              if (!z && a.includes('-') && !(a in own)) [a, z] = a.split('-');   // «пп. 1-2» is a range, «пп. 18-1» a sub-point
              if (z) for (let x = parseInt(a, 10); x <= +z; x++) subs.push(String(x)); else subs.push(a);
              const sp = at(RX.subSep, s, q); if (!sp) break; q = RX.subSep.lastIndex;
            }
            if (subs.length) { k = q; if (ss[1].includes('(') && s[k] === ')') k++; }
          }
          const book = D[d === 'pdd' ? 'p' : d];
          const label = s.slice(first ? i : j, k);
          out += book && book[pn[1]] ? btn(label, { k: 'p', d, n: pn[1], s: subs.join(',') }) : esc(label);
          first = false; j = k;
          const more = at(RX.ptMore, s, j); if (!more) break;
          out += esc(more[1]); j = RX.ptMore.lastIndex;
        }
        i = plain = j; continue;
      }
      if (!isWord(prev) && (m = at(RX.gl, s, i))) {
        const key = (doc === 'pn' ? 'pn:' : doc === 'pr2' ? 'pr2:' : '') + m[1];
        if (D.gl[key]) { flush(i); out += btn(m[0], { k: 'g', n: key }); i = plain = RX.gl.lastIndex; continue; }
      }
      const ctx = !isWord(prev) && ((m = at(RX.sign, s, i)) ? 's' : (m = at(RX.mark, s, i)) ? 'm' : null);
      if (ctx) {
        const rx = ctx === 's' ? RX.sign : RX.mark;
        let j = rx.lastIndex;
        flush(j);
        for (;;) {
          const nm = at(RX.num, s, j); if (!nm) break;
          const n = signNum(nm[1]);
          out += (D[ctx][n] || (ctx === 's' && window.REFS_IMG && window.REFS_IMG(n))) ? btn(nm[1], { k: ctx, n }) : esc(nm[1]);
          j = RX.num.lastIndex;
          const sp = at(RX.numSep, s, j); if (!sp) break;
          out += esc(sp[1]); j = RX.numSep.lastIndex;
        }
        i = plain = j; continue;
      }
      if (!isWord(prev) && prev !== '.' && prev !== ',' && (m = at(RX.bare, s, i)) && D.s[signNum(m[1])] && (opt.bare1 || m[1][0] !== '1')) {
        flush(i); out += btn(m[1], { k: 's', n: signNum(m[1]) }); i = plain = RX.bare.lastIndex; continue;
      }
      i++;
    }
    flush(s.length);
    return out;
  }

  // ---------- Sheet ----------
  let dlg = null;
  // Styles go in at load, so the links look like links before the first sheet opens.
  const st = document.createElement('style');
    st.textContent = `
.rf { font: inherit; color: var(--accent-text, #006C8A); background: none; border: 0; padding: 0; margin: 0; cursor: pointer; text-decoration: underline dotted; text-underline-offset: 3px; text-decoration-thickness: 1.5px; }
.rf:hover { text-decoration-style: solid; }
.rf:focus-visible { outline: 2px solid var(--accent, #0A87A8); outline-offset: 2px; border-radius: 3px; }
.rfd { border: 1px solid var(--line, #D5DEE4); border-radius: 16px; padding: 0; width: min(640px, calc(100vw - 24px)); max-height: min(80vh, 760px); background: var(--surface, #fff); color: var(--ink, #14202A); box-shadow: 0 18px 50px rgba(0,0,0,.35); }
.rfd::backdrop { background: rgba(10, 16, 20, .55); }
.rfd-in { display: grid; grid-template-rows: auto 1fr auto; max-height: inherit; }
.rfd-h { display: flex; gap: 12px; align-items: flex-start; justify-content: space-between; padding: 16px 18px 10px; border-bottom: 1px solid var(--line, #D5DEE4); }
.rfd-h h2 { margin: 0; font: 700 22px/1.15 var(--f-num, "Arial Narrow", sans-serif); text-transform: uppercase; letter-spacing: .01em; }
.rfd-h small { display: block; margin-top: 4px; font: 500 13px/1.3 var(--f-body, system-ui, sans-serif); color: var(--muted, #5B6975); text-transform: none; letter-spacing: 0; }
.rfd-x { flex: none; width: 36px; height: 36px; border-radius: 10px; border: 1px solid var(--line, #D5DEE4); background: var(--surface-2, #EAF0F3); color: inherit; font-size: 20px; line-height: 1; cursor: pointer; }
.rfd-b { overflow: auto; padding: 14px 18px; display: grid; gap: 10px; font: 400 15px/1.55 var(--f-body, system-ui, sans-serif); }
.rfd-b p { margin: 0; }
.rfd-b p.sub { padding-left: 14px; border-left: 3px solid var(--line, #D5DEE4); }
.rfd-b p.hl { border-left-color: var(--accent, #0A87A8); background: var(--accent-soft, #DCF1F6); border-radius: 0 8px 8px 0; padding: 6px 10px 6px 12px; }
.rfd-b img { display: block; max-width: 120px; max-height: 120px; margin: 0 auto 4px; background: #fff; border-radius: 6px; }
.rfd-more { justify-self: start; font: 600 14px var(--f-body, system-ui, sans-serif); color: var(--accent-text, #006C8A); background: none; border: 0; padding: 2px 0; cursor: pointer; }
.rfd-f { padding: 10px 18px 16px; border-top: 1px solid var(--line, #D5DEE4); font: 500 13px var(--f-body, system-ui, sans-serif); color: var(--muted, #5B6975); }

  // ---------- Helpers ----------
  const NSVG = 'http://www.w3.org/2000/svg';
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const $ = id => document.getElementById(id);
  const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const KEY = 'pdd-rk-perekrestki.v1';
  let progress = {};
  try { progress = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) { progress = {}; }
  const saveProgress = () => { try { localStorage.setItem(KEY, JSON.stringify(progress)); } catch (e) { /* ignore */ } };

  const chipLabel = p => {
    const what = p.kind === 'tram' ? 'трамвай, ' : p.kind === 'amb' ? 'скорая, ' : '';
    return what + (p.ml || MOVE[p.m]);
  };
  const plural = (n, [a, b, c]) => { const m10 = n % 10, m100 = n % 100; return m10 === 1 && m100 !== 11 ? a : m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14) ? b : c; };
  const join = ids => ids.length === 1 ? ids[0] : ids.slice(0, -1).join(', ') + ' и ' + ids[ids.length - 1];
  function answerHTML(s) {
    let h = s.order.map((grp, i) => `<span class="n">${i + 1}</span>${esc(join(grp))}${grp.length > 1 ? ' одновременно' : ''}`).join(' → ');
    if (s.stay && s.stay.length) h += `<br>Стоят: ${esc(join(s.stay))}`;
    return h;
  }

  // ---------- Card ----------
  function cardHTML(s) {
    const grp = GROUPS.find(g => g.k === s.g);
    const who = s.P.map(p => `<button type="button" data-p="${esc(p.id)}" aria-pressed="false"><i style="border-color:${COL[p.id]}">${esc(p.id)}</i>${esc(chipLabel(p))}<b></b></button>`).join('');
    return `<article class="card" id="card-${s.id}" data-id="${s.id}">
      <div class="card-h"><h3>${esc(s.t)}</h3><span class="tag">${esc(grp.t)}<span class="tick" hidden>✓</span></span></div>
      <div class="stage"><svg class="sc" viewBox="0 0 400 400" role="img" aria-label="${esc(s.t + '. ' + s.setup)}">
        ${roadsSVG(s)}${extrasSVG(s)}<g class="l-rails"></g><g class="l-arrows"></g>${controlsSVG(s)}<g class="l-veh"></g><g class="l-bdg"></g><g class="l-paths"></g>
      </svg></div>
      <p class="setup">${(window.REFS ? window.REFS.html : esc)(s.setup)}</p>
      <div class="who" role="group" aria-label="Участники">${who}</div>
      <p class="hint">Ваш порядок: <span class="seq">нажмите участников по очереди</span></p>
      <div class="act"><button type="button" class="btn primary" data-a="check" disabled>Проверить</button><button type="button" class="btn" data-a="reset">Сначала</button><button type="button" class="btn" data-a="show">Показать ответ</button></div>
      <div class="result" hidden><p class="verdict"></p><p class="answer">${answerHTML(s)}</p><p class="why">${(window.REFS ? window.REFS.html : esc)(s.why)}</p><p class="ref">${(window.REFS ? window.REFS.html : esc)(/^(п\.|Прил\.)/.test(s.ref) && !s.ref.includes('ПДД') ? s.ref + ' ПДД РК' : s.ref)}</p><div><button type="button" class="link-btn replay" data-a="replay">Показать проезд ещё раз</button></div></div>
    </article>`;
  }

  const ST = {};
  function el(name, attrs) { const e = document.createElementNS(NSVG, name); for (const k in attrs) e.setAttribute(k, attrs[k]); return e; }

  function setupCard(s) {
    const card = $('card-' + s.id);
    const svg = card.querySelector('svg');
    const L = { rails: svg.querySelector('.l-rails'), arrows: svg.querySelector('.l-arrows'), veh: svg.querySelector('.l-veh'), bdg: svg.querySelector('.l-bdg'), paths: svg.querySelector('.l-paths') };
    const st = { s, card, items: {}, seq: [], token: 0 };
    const box = BOX[s.lay];
    const stay = new Set(s.stay || []);
    s.P.forEach(p => {
      const kind = p.kind || 'car';
      const d = p.path || rotPath(SP[p.m], ANG[p.at]);
      const pe = el('path', { d, fill: 'none', stroke: 'none' });
      L.paths.appendChild(pe);
      const len = pe.getTotalLength();
      const d0 = p.d0 !== undefined ? p.d0 : 120;
      if (kind === 'tram') { L.rails.appendChild(el('path', { d, class: 'rail-o' })); L.rails.appendChild(el('path', { d, class: 'rail-i' })); }
      // Arrow from the vehicle front until it leaves the junction area.
      const pts = [];
      let entered = false;
      const inB = (q, m) => q.x >= box[0] - m && q.x <= box[1] + m && q.y >= box[2] - m && q.y <= box[3] + m;
      for (let x = d0 + HALF[kind] + 4; x <= len; x += 4) {
        const q = pe.getPointAtLength(x);
        pts.push(q);
        if (inB(q, 0)) entered = true;
        else if (entered && !inB(q, box[4])) break;
      }
      if (pts.length > 1) {
        const c = COL[p.id];
        const a = pts[pts.length - 1], b = pts[pts.length - 2];
        const ang = Math.atan2(a.y - b.y, a.x - b.x);
        const head = [[a.x + Math.cos(ang) * 6, a.y + Math.sin(ang) * 6], [a.x + Math.cos(ang + 2.4) * 9, a.y + Math.sin(ang + 2.4) * 9], [a.x + Math.cos(ang - 2.4) * 9, a.y + Math.sin(ang - 2.4) * 9]];
        L.arrows.appendChild(el('polyline', { points: pts.map(q => `${q.x.toFixed(1)},${q.y.toFixed(1)}`).join(' '), class: 'arrow' + (kind === 'ped' ? ' dash' : ''), stroke: c }));
        L.arrows.appendChild(el('polygon', { points: head.map(h => h.map(v => v.toFixed(1)).join(',')).join(' '), fill: c, opacity: .9 }));
      }
      const veh = el('g', { class: 'veh', 'data-p': p.id });
      veh.innerHTML = vehicleSVG(p);
      L.veh.appendChild(veh);
      const bdg = el('g', { class: 'bdg', 'data-p': p.id });
      const tc = kind === 'amb' ? '#B8C2C9' : COL[p.id];
      bdg.innerHTML = `<circle r="9.5" fill="#FFFFFF" stroke="${tc}" stroke-width="3"/><text y="4" text-anchor="middle" font-family="Golos Text, Arial, sans-serif" font-weight="700" font-size="${p.id.length > 1 ? 9 : 11}" fill="#14202A">${esc(p.id)}</text>`
        + `<g class="ans" transform="translate(15 -15)"><circle r="10.5" fill="#FFC72C" stroke="#14202A" stroke-width="1.5"/><text class="ans-t" y="4.5" text-anchor="middle" font-family="Fira Sans Extra Condensed, Arial Narrow, sans-serif" font-weight="700" font-size="14" fill="#14202A"></text></g>`
        + `<g class="pk" transform="translate(-15 -15)"><circle r="10" fill="#0A87A8" stroke="#FFFFFF" stroke-width="1.5"/><text class="pk-t" y="4.5" text-anchor="middle" font-family="Fira Sans Extra Condensed, Arial Narrow, sans-serif" font-weight="700" font-size="13" fill="#FFFFFF"></text></g>`
        + (stay.has(p.id) ? `<g class="xs" transform="translate(15 -15)"><circle r="10.5" fill="#C62A2F" stroke="#FFFFFF" stroke-width="1.5"/><path d="M-4 -4L4 4M4 -4L-4 4" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round"/></g>` : '');
      L.bdg.appendChild(bdg);
      const gi = s.order.findIndex(gr => gr.includes(p.id));
      if (gi >= 0) bdg.querySelector('.ans-t').textContent = gi + 1;
      else bdg.querySelector('.ans').remove();
      st.items[p.id] = { p, pe, len, d0, veh, bdg, kind };
      place(st.items[p.id], d0);
    });
    card.querySelector('svg').addEventListener('click', e => {
      const t = e.target.closest('[data-p]');
      if (t) pick(st, t.getAttribute('data-p'));
    });
    card.addEventListener('click', e => {
      const b = e.target.closest('button');
      if (!b) return;
      if (b.dataset.p) pick(st, b.dataset.p);
      const a = b.dataset.a;
      if (a === 'check') check(st);
      if (a === 'reset') resetCard(st);
      if (a === 'show') reveal(st, null);
      if (a === 'replay') play(st);
    });
    ST[s.id] = st;
  }

  function place(it, d) {
    const len = it.len;
    const dd = Math.max(0, Math.min(len, d));
    const q = it.pe.getPointAtLength(dd);
    const q2 = dd + 2 <= len ? it.pe.getPointAtLength(dd + 2) : null;
    const q1 = q2 ? q : it.pe.getPointAtLength(Math.max(0, dd - 2));
    const qq = q2 || q;
    let deg = Math.atan2(qq.y - q1.y, qq.x - q1.x) * 180 / Math.PI + 90;
    if (it.kind === 'ped') deg = 0;
    it.veh.setAttribute('transform', `translate(${q.x.toFixed(1)} ${q.y.toFixed(1)}) rotate(${deg.toFixed(1)})`);
    it.bdg.setAttribute('transform', `translate(${q.x.toFixed(1)} ${q.y.toFixed(1)})`);
  }

  function updatePicks(st) {
    const { card, seq } = st;
    Object.values(st.items).forEach(it => {
      const i = seq.indexOf(it.p.id);
      const pk = it.bdg.querySelector('.pk');
      pk.classList.toggle('on', i >= 0);
      if (i >= 0) pk.querySelector('.pk-t').textContent = i + 1;
    });
    card.querySelectorAll('.who button').forEach(b => {
      const i = seq.indexOf(b.dataset.p);
      b.setAttribute('aria-pressed', String(i >= 0));
      b.querySelector('b').textContent = i >= 0 ? i + 1 : '';
    });
    card.querySelector('.seq').textContent = seq.length ? seq.map((id, i) => `${i + 1}. ${id}`).join('  →  ') : 'нажмите участников по очереди';
    card.querySelector('[data-a="check"]').disabled = seq.length === 0 || card.classList.contains('answer');
  }

  function pick(st, id) {
    if (st.card.classList.contains('answer') || st.running) return;
    if (st.seq.includes(id)) { st.seq = st.seq.filter(x => x !== id); updatePicks(st); return; }
    st.seq.push(id);
    updatePicks(st);
    const movers = st.s.order.flat();
    if (st.seq.length === movers.length && st.seq.every(x => movers.includes(x))) check(st);
  }

  function evaluate(s, seq) {
    const stay = s.stay || [];
    const bad = seq.find(x => stay.includes(x));
    if (bad) return { ok: false, msg: `Не так: ${bad} сейчас ехать нельзя.` };
    const movers = s.order.flat();
    if (seq.length !== movers.length || !movers.every(x => seq.includes(x))) return { ok: false, msg: 'Не так: в вашем ответе не все, кто едет.' };
    const gi = id => s.order.findIndex(g => g.includes(id));
    for (let i = 1; i < seq.length; i++) if (gi(seq[i]) < gi(seq[i - 1])) return { ok: false, msg: 'Не так: очередь другая.' };
    return { ok: true, msg: 'Верно!' };
  }

  function check(st) {
    if (!st.seq.length) return;
    const r = evaluate(st.s, st.seq);
    progress[st.s.id] = r.ok ? 'ok' : 'bad';
    saveProgress();
    reveal(st, r);
    updateProgress();
  }

  function reveal(st, r) {
    const { card } = st;
    card.classList.remove('r-ok', 'r-bad');
    if (r) card.classList.add(r.ok ? 'r-ok' : 'r-bad');
    card.querySelector('.verdict').textContent = r ? r.msg : 'Ответ';
    card.querySelector('.result').hidden = false;
    card.classList.add('answer');
    card.querySelector('[data-a="check"]').disabled = true;
    markCard(st.s.id);
    play(st);
  }

  function resetCard(st) {
    st.token++;
    st.running = false;
    st.seq = [];
    const { card } = st;
    card.classList.remove('answer', 'r-ok', 'r-bad');
    card.querySelector('.result').hidden = true;
    Object.values(st.items).forEach(it => { place(it, it.d0); it.bdg.querySelector('.ans')?.classList.remove('on'); it.veh.style.opacity = ''; it.bdg.style.opacity = ''; });
    updatePicks(st);
  }

  const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  function play(st) {
    const tok = ++st.token;
    const items = Object.values(st.items);
    items.forEach(it => { place(it, it.d0); it.veh.style.opacity = ''; it.bdg.style.opacity = ''; });
    if (reduce) { st.running = false; return; }
    st.card.classList.remove('answer');
    items.forEach(it => it.bdg.querySelector('.ans')?.classList.remove('on'));
    st.running = true;
    let gi = 0;
    const DUR = 1600;
    const next = () => {
      if (tok !== st.token) return;
      if (gi >= st.s.order.length) {
        // End state: everyone back at the start with order numbers.
        setTimeout(() => {
          if (tok !== st.token) return;
          items.forEach(it => { place(it, it.d0); it.veh.style.opacity = ''; it.bdg.style.opacity = ''; });
          st.card.classList.add('answer');
          st.running = false;
        }, 350);
        return;
      }
      const grp = st.s.order[gi].map(id => st.items[id]);
      grp.forEach(it => it.bdg.querySelector('.ans')?.classList.add('on'));
      const t0 = performance.now();
      const frame = now => {
        if (tok !== st.token) return;
        const t = Math.min(1, (now - t0) / DUR), e = ease(t);
        grp.forEach(it => {
          const dEnd = it.len;
          place(it, it.d0 + e * (dEnd - it.d0));
          if (t > .85) { const o = String(Math.max(0, 1 - (t - .85) / .15)); it.veh.style.opacity = o; it.bdg.style.opacity = o; }
        });
        if (t < 1) requestAnimationFrame(frame);
        else { gi++; setTimeout(next, 220); }
      };
      requestAnimationFrame(frame);
    };
    setTimeout(next, 250);
  }

  // ---------- Page ----------
  let filter = 'all', todoOnly = false;
  function markCard(id) {
    const card = $('card-' + id);
    const ok = progress[id] === 'ok';
    card.classList.toggle('ok', ok);
    card.querySelector('.tick').hidden = !ok;
  }
  function updateProgress() {
    const n = S.filter(s => progress[s.id] === 'ok').length;
    $('okc').textContent = n;
    $('okt').textContent = S.length;
    $('okbar').style.width = (100 * n / S.length).toFixed(1) + '%';
  }
  function renderChips() {
    const cnt = k => S.filter(s => s.g === k).length;
    $('chips').innerHTML = `<button type="button" class="chip" data-f="all" aria-pressed="${filter === 'all'}">Все <span class="n">${S.length}</span></button>`
      + GROUPS.map(g => `<button type="button" class="chip" data-f="${g.k}" aria-pressed="${filter === g.k}">${g.t} <span class="n">${cnt(g.k)}</span></button>`).join('')
      + `<button type="button" class="chip todo" data-f="todo" aria-pressed="${todoOnly}">Ещё не решены</button>`;
  }
  function applyFilter() {
    S.forEach(s => {
      const show = (filter === 'all' || s.g === filter) && (!todoOnly || progress[s.id] !== 'ok');
      $('card-' + s.id).hidden = !show;
    });
    GROUPS.forEach(g => {
      const any = S.some(s => s.g === g.k && !$('card-' + s.id).hidden);
      $('sec-' + g.k).hidden = !any;
    });
    $('chips').querySelectorAll('.chip').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.f === 'todo' ? todoOnly : b.dataset.f === filter)));
  }

  function legend() {
    const mini = (inner, vb = '0 0 60 60') => `<svg viewBox="${vb}" aria-hidden="true">${inner}</svg>`;
    const carIcon = id => `<rect width="60" height="60" rx="8" fill="#3A434A"/><g transform="translate(30 34)">${vehicleSVG({ id })}</g><g transform="translate(30 34)"><circle r="9.5" fill="#fff" stroke="${COL[id]}" stroke-width="3"/><text y="4" text-anchor="middle" font-family="Golos Text, Arial" font-weight="700" font-size="11" fill="#14202A">${id}</text></g>`;
    const items = [
      [mini(carIcon('А')), 'Участник с буквой. Стрелка его цвета показывает, куда он едет.'],
      [mini(`<rect width="60" height="60" rx="8" fill="#3A434A"/><g transform="translate(30 30) rotate(90) scale(.8)">${vehicleSVG({ id: 'Т', kind: 'tram' })}</g>`), 'Т — трамвай, под ним рельсы.'],
      [mini(`<rect width="60" height="60" rx="8" fill="#3A434A"/><g transform="translate(30 30)">${vehicleSVG({ id: 'С', kind: 'amb' })}</g>`), 'С — скорая с синим маячком и сиреной.'],
      [mini(`<g transform="translate(5 5) scale(.5)">${SIGN['2.1']()}</g>`), '2.1 «Главная дорога».'],
      [mini(`<g transform="translate(5 5) scale(.5)">${SIGN['2.4']()}</g>`), '2.4 «Уступите дорогу».'],
      [mini(`<g transform="translate(5 5) scale(.5)">${SIGN['2.5']()}</g>`), '2.5 «Движение без остановки запрещено».'],
      [mini(plateG('S', ALL4, ['S', 'W'], 30, 30, .5)), 'Табличка 7.13: толстые линии — главная дорога. Сторона таблички, ближайшая к знаку, — верх.'],
      [mini(`<g transform="translate(5 5) scale(.5)">${SIGN['4.3']()}</g>`), '4.3 «Круговое движение».'],
      [mini(lightG(22, 30, { c: 'r', arrow: 'on', plus: true })), 'Светофор. Справа внизу стрелка дополнительной секции, справа вверху зелёный «+».'],
      [mini(lightG(30, 30, { t: ['b', 'r'] })), 'Трамвайный светофор: нижний сигнал и верхний левый, средний или правый разрешают налево, прямо или направо.'],
      [mini(`<rect width="60" height="60" rx="8" fill="#3A434A"/><rect x="18" y="0" width="24" height="60" fill="#B5523B" fill-opacity=".85"/><g transform="translate(30 32)">${vehicleSVG({ id: 'В', kind: 'bike' })}</g>`), 'Велодорожка и велосипедист.'],
      [mini(`<rect width="60" height="60" rx="8" fill="#3A434A"/><g transform="translate(-170 -170)">${regulatorG('S', 'right')}</g>`), 'Регулировщик сверху. Треугольник у головы показывает, куда смотрит грудь.'],
      [mini(`<g transform="translate(30 30)"><circle r="12" fill="#FFC72C" stroke="#14202A" stroke-width="2"/><text y="5.5" text-anchor="middle" font-family="Fira Sans Extra Condensed, Arial" font-weight="700" font-size="17" fill="#14202A">1</text></g>`), 'Жёлтый номер — место в очереди в правильном ответе. Синий номер — ваш выбор.'],
      [mini(`<g transform="translate(30 30)"><circle r="12" fill="#C62A2F" stroke="#fff" stroke-width="2"/><path d="M-5 -5L5 5M5 -5L-5 5" stroke="#fff" stroke-width="3" stroke-linecap="round"/></g>`), 'Красный крест — этому участнику сейчас ехать нельзя.']
    ];
    $('legend-grid').innerHTML = items.map(([icon, text]) => `<div class="lg">${icon}<span>${esc(text)}</span></div>`).join('');
  }

  function build() {
    $('list').innerHTML = GROUPS.map(g => {
      const items = S.filter(s => s.g === g.k);
      return `<section class="sec" id="sec-${g.k}"><h2>${esc(g.t)} <small>${items.length}</small></h2><ol class="rules">${g.rules.map(r => `<li>${(window.REFS ? window.REFS.html : esc)(r)}</li>`).join('')}</ol></section>` + items.map(cardHTML).join('');
    }).join('');
    S.forEach(setupCard);
    S.forEach(s => markCard(s.id));
    renderChips();
    legend();
    updateProgress();
    applyFilter();
  }

  $('chips').addEventListener('click', e => {
    const b = e.target.closest('.chip');
    if (!b) return;
    if (b.dataset.f === 'todo') todoOnly = !todoOnly; else filter = b.dataset.f;
    applyFilter();
  });
  $('resetp').addEventListener('click', () => {
    progress = {};
    saveProgress();
    S.forEach(s => { markCard(s.id); resetCard(ST[s.id]); });
    updateProgress();
    applyFilter();
  });
  // In print every card shows the answer: numbers on vehicles and the explanation.
  window.addEventListener('beforeprint', () => { S.forEach(s => { const st = ST[s.id]; st.token++; st.running = false; Object.values(st.items).forEach(it => { place(it, it.d0); it.veh.style.opacity = ''; it.bdg.style.opacity = ''; }); }); });

  build();
})();
</script>

</body>
